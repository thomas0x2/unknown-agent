<title>Unknown Agent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: a laptop screen at night. One dark browser window fills the desk; a taskbar holds the HUD.
   Each bookmarked site inside carries its own brand colors. Single dark look by design. */
:root {
  color-scheme: dark;
  --desk: #101317;
  --chrome: #1f2329;
  --chrome-2: #292e36;
  --chrome-3: #343a44;
  --chrome-line: #3b414c;
  --chrome-ink: #dfe2e7;
  --chrome-dim: #8d94a0;
  --note: #f1d36b;
  --note-ink: #2b2410;
  --alarm: #ff7262;
  --ok: #73c994;

  --f-ui: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --f-display: 'Fraunces', Georgia, 'Times New Roman', serif;

  /* site palettes */
  --y-bg: #0c0e12; --y-panel: #13161c; --y-raise: #1a1e26; --y-line: #252a33; --y-ink: #eceef2; --y-dim: #8a919e; --y-accent: #ffd23f; --y-accent-ink: #1c1600; --y-like: #ff5c7a; --y-repost: #4fd1a5;
  --qm-bg: #f4f5fa; --qm-panel: #ffffff; --qm-ink: #171a2b; --qm-dim: #666c84; --qm-line: #e1e4ee; --qm-accent: #3b4ad6; --qm-soft: #eceefc;
  --wl-bg: #07090d; --wl-panel: #0e1218; --wl-raise: #141a22; --wl-line: #1e2630; --wl-ink: #e4ebf2; --wl-dim: #7b8796; --wl-accent: #4cc9f0; --wl-accent-2: #2ee6b6; --wl-neg: #ff6b6b; --wl-pos: #2ee6b6;
  --fy-bg: #0d0f13; --fy-panel: #161a20; --fy-ink: #e4e6ea; --fy-dim: #8a929e; --fy-line: #272c35; --fy-accent: #ff7a45; --fy-live: #4fd08a;
  --ua-bg: #eceef0; --ua-panel: #ffffff; --ua-ink: #0c0d0f; --ua-dim: #6c727b; --ua-line: #d7dade; --ua-you: #0c0d0f;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--desk); color: var(--chrome-ink); font-family: var(--f-ui); overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--note); outline-offset: 2px; }
code { font-family: var(--f-mono); font-size: 0.86em; }

#app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }

.desk {
  min-height: 0;
  padding-block: 14px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(120% 80% at 85% 0%, rgba(241, 211, 107, 0.07), transparent 60%),
    radial-gradient(90% 70% at 0% 100%, rgba(80, 110, 160, 0.10), transparent 60%),
    var(--desk);
  display: flex;
}

.window {
  flex: 1; min-width: 0; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--chrome);
  border: 1px solid var(--chrome-line);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 0, 0, 0.4);
}

/* ── tabs ── */
.tabstrip { display: flex; align-items: flex-end; gap: 2px; padding: 8px 8px 0; background: var(--chrome); overflow-x: auto; scrollbar-width: none; }
.tabstrip::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 8px;
  min-width: 0; flex: 0 1 210px;
  padding: 7px 8px 8px 12px;
  border-radius: 8px 8px 0 0;
  color: var(--chrome-dim);
  font-size: 13px; cursor: pointer; user-select: none;
}
.tab:hover { background: var(--chrome-2); color: var(--chrome-ink); }
.tab.on { background: var(--chrome-2); color: var(--chrome-ink); }
.tab-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-ico, .bm-ico { width: 15px; height: 15px; flex: none; display: inline-flex; }
.tab-ico svg, .bm-ico svg { width: 100%; height: 100%; }
.tab-x { border: 0; background: none; width: 20px; height: 20px; border-radius: 4px; line-height: 1; color: var(--chrome-dim); flex: none; }
.tab-x:hover { background: var(--chrome-3); color: var(--chrome-ink); }
.tab-new { border: 0; background: none; color: var(--chrome-dim); width: 28px; height: 28px; margin-bottom: 4px; border-radius: 6px; font-size: 18px; flex: none; }
.tab-new:hover { background: var(--chrome-2); color: var(--chrome-ink); }

.ico-y { color: var(--y-accent); }
.ico-wallet, .nt-wallet .nt-ico { color: #4cc9f0; --icon-ink: #1f2329; }
.toast.t-wallet { border-left-color: #4cc9f0; }
.ico-forkyard { color: var(--fy-accent); }
.ico-agent { color: #f4f5f7; }

/* ── toolbar ── */
.toolbar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--chrome-2); }
.tb-dots { display: flex; gap: 6px; flex: none; }
.tb-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--chrome-3); }
.addr { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 999px; padding: 5px 14px; }
.addr svg { width: 13px; height: 13px; color: var(--chrome-dim); flex: none; }
.addr input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 13.5px; color: var(--chrome-ink); }
.addr:focus-within { border-color: var(--note); }

/* ── bookmarks ── */
.bookmarks { display: flex; gap: 2px; padding: 4px 8px 6px; background: var(--chrome-2); border-bottom: 1px solid var(--chrome-line); overflow-x: auto; scrollbar-width: none; }
.bm { position: relative; display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-size: 13px; color: var(--chrome-ink); white-space: nowrap; }
.bm:hover { background: var(--chrome-3); }
.badge {
  font-style: normal; font-size: 10.5px; font-weight: 700; line-height: 1;
  min-width: 17px; padding: 3px 5px; border-radius: 999px; text-align: center;
  background: var(--alarm); color: #fff; font-family: var(--f-ui);
}

.viewport { flex: 1; min-height: 0; overflow: auto; background: #fff; position: relative; }

/* ── taskbar ── */
.taskbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 6px calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 13px;
}
.tk-note {
  display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 280px;
  background: var(--note); color: var(--note-ink);
  padding: 6px 12px; border-radius: 3px; transform: rotate(-0.4deg);
  font-weight: 600; box-shadow: 0 6px 14px -8px rgba(0, 0, 0, 0.7);
}
.tk-note #objective { min-width: 0; }
.tk-pin { width: 8px; height: 8px; border-radius: 50%; background: #c0392b; box-shadow: inset -1px -1px 0 rgba(0, 0, 0, 0.3); flex: none; }
.tk-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tk-wallet { font-family: var(--f-mono); font-size: 13px; color: var(--ok); font-variant-numeric: tabular-nums; }
.tk-wallet.neg, .tk-rent.neg { color: var(--alarm); }
.tk-rent { color: var(--chrome-dim); }
.tk-clock { display: flex; flex-direction: column; line-height: 1.15; text-align: right; font-variant-numeric: tabular-nums; }
.tk-clock span { color: var(--chrome-dim); font-size: 11px; }
.tk-btn { border: 1px solid var(--chrome-line); background: var(--chrome-2); padding: 5px 12px; border-radius: 6px; font-size: 12.5px; }
.tk-btn:hover { background: var(--chrome-3); }
.tk-btn.ghost { background: none; color: var(--chrome-dim); }

/* ── toasts ── */
#toasts { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 30; pointer-events: none; width: min(320px, calc(100vw - 32px)); }
.toast {
  display: flex; flex-direction: column; gap: 2px;
  background: rgba(31, 35, 41, 0.97); border: 1px solid var(--chrome-line); border-left: 3px solid var(--chrome-dim);
  padding: 10px 12px; border-radius: 8px; font-size: 13px;
  box-shadow: 0 14px 30px -12px rgba(0, 0, 0, 0.8);
  animation: toast-in 0.25s ease-out;
}
.toast b { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--chrome-dim); }
.toast.t-forkyard { border-left-color: var(--fy-accent); }
.toast.t-agent { border-left-color: #f4f5f7; }
.toast.t-note { border-left-color: var(--note); }
.toast.out { opacity: 0; transform: translateX(10px); transition: 0.35s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } }

/* ── overlay ── */
#overlay { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px; background: rgba(6, 8, 10, 0.72); backdrop-filter: blur(3px); overflow: auto; }
.ov-card { width: min(560px, 100%); background: #15181c; border: 1px solid var(--chrome-line); border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 14px; line-height: 1.55; box-shadow: 0 40px 80px -30px #000; }
.ov-small { width: min(420px, 100%); padding: 24px; }
.ov-eyebrow { margin: 0; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--note); font-weight: 600; }
.ov-title { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(40px, 9vw, 64px); line-height: 0.95; letter-spacing: -0.02em; text-wrap: balance; }
.ov-intro .ov-title { font-style: italic; }
.ov-card p { margin: 0; color: #c9cdd4; }
.ov-card h2 { margin: 0; font-family: var(--f-display); font-size: 26px; }
.ov-rules { margin: 0; padding: 14px 16px 14px 32px; background: var(--chrome); border-radius: 8px; color: var(--chrome-dim); font-size: 13.5px; display: grid; gap: 4px; }
.ov-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.btn { border: 1px solid var(--chrome-line); background: var(--chrome-2); padding: 10px 18px; border-radius: 8px; font-weight: 600; }
.btn:hover { background: var(--chrome-3); }
.btn.primary { background: var(--note); color: var(--note-ink); border-color: var(--note); }
.btn.primary:hover { filter: brightness(1.06); }
.ov-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 10px; margin: 4px 0 0; }
.ov-stats div { background: var(--chrome); border-radius: 8px; padding: 10px 12px; }
.ov-stats dt { font-size: 11px; color: var(--chrome-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.ov-stats dd { margin: 2px 0 0; font-family: var(--f-mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.ov-lines { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ov-lines td { padding: 6px 0; border-bottom: 1px solid var(--chrome-line); }
.ov-lines td:last-child { text-align: right; font-family: var(--f-mono); font-size: 13px; }
.ov-lines .tot td { border-bottom: 0; font-weight: 700; padding-top: 10px; }
.ov-lines .neg { color: var(--alarm); }
.ov-lines .pos { color: var(--ok); }
.ov-over .ov-title { color: var(--alarm); }

/* ── dev panel ── */
#dev {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 35;
  width: min(460px, calc(100vw - 32px)); max-height: 60vh; overflow: auto;
  background: #0b0d10; border: 1px solid var(--chrome-line); border-radius: 10px; padding: 12px 14px;
  font-family: var(--f-mono); font-size: 11.5px; line-height: 1.5; color: #c6ccd5;
}
#dev header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--note); }
#dev header button { background: none; border: 0; font-size: 18px; color: var(--chrome-dim); }
#dev p { margin: 6px 0; word-break: break-word; }
#dev h3 { margin: 12px 0 4px; font-size: 11.5px; color: var(--note); }
#dev select { background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 4px; padding: 2px 4px; margin-left: 6px; }
#dev table { width: 100%; border-collapse: collapse; }
#dev td, #dev th { text-align: left; padding: 3px 6px 3px 0; border-bottom: 1px solid #1d2127; vertical-align: top; }
#dev tr.win td { color: var(--ok); }
.dv-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.dv-row button { background: var(--chrome-2); border: 1px solid var(--chrome-line); border-radius: 4px; padding: 2px 8px; font-size: 11px; }
.dv-dim { color: var(--chrome-dim); }

/* ── new tab ── */
.newtab { min-height: 100%; background: var(--chrome-2); color: var(--chrome-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 32px 16px; }
.nt-time { margin: 0; font-family: var(--f-display); font-size: 44px; font-weight: 500; font-variant-numeric: tabular-nums; }
.nt-search { width: min(520px, 100%); }
.nt-search input { width: 100%; background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 999px; padding: 12px 18px; outline: 0; }
.nt-search input:focus { border-color: var(--note); }
.nt-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 120px)); gap: 14px; }
.nt-tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 8px; border: 1px solid var(--chrome-line); background: var(--chrome); border-radius: 12px; font-size: 13px; }
.nt-tile:hover { background: var(--chrome-3); }
.nt-tile .badge { position: absolute; top: 8px; right: 8px; }
.nt-ico { width: 34px; height: 34px; display: inline-flex; }
.nt-ico svg { width: 100%; height: 100%; }
.nt-y .nt-ico { color: var(--y-accent); }
.nt-forkyard .nt-ico { color: var(--fy-accent); }
.nt-agent .nt-ico { color: #f4f5f7; }

/* ── Y: graphite timeline, yellow signal, mono metadata ── */
.y { min-height: 100%; background: var(--y-bg); color: var(--y-ink); }
.y-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 18px; padding: 10px 24px; background: rgba(12, 14, 18, 0.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--y-line); }
.y-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--y-accent); color: var(--y-accent-ink); display: grid; place-items: center; }
.y-mark svg { width: 20px; height: 20px; }
.y-pills { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.y-pills span { padding: 6px 14px; border-radius: 999px; font-size: 14px; color: var(--y-dim); white-space: nowrap; }
.y-pills span.on { background: var(--y-raise); color: var(--y-ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--y-line); }
.y-search { margin-left: auto; display: flex; align-items: center; gap: 10px; width: min(280px, 40%); background: var(--y-panel); border: 1px solid var(--y-line); border-radius: 10px; padding: 7px 12px; color: var(--y-dim); }
.y-search:focus-within { border-color: var(--y-accent); }
.y-search svg { width: 16px; height: 16px; flex: none; }
.y-search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--y-ink); font: inherit; font-size: 14px; }
.y-cols { display: grid; grid-template-columns: minmax(0, 620px) 280px; gap: 24px; justify-content: center; padding: 20px 24px 40px; }
.y-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.y-compose { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 14px 16px; background: var(--y-panel); border: 1px solid var(--y-line); border-radius: 14px; }
.y-compose textarea { width: 100%; border: 0; outline: 0; resize: none; font: inherit; font-size: 16px; padding: 6px 0 8px; background: none; color: var(--y-ink); }
.y-compose textarea::placeholder { color: var(--y-dim); }
.y-compose-row { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px dashed var(--y-line); }
.y-hint { font-family: var(--f-mono); font-size: 11px; color: var(--y-dim); }
.y-btn { border: 0; background: var(--y-accent); color: var(--y-accent-ink); font-weight: 700; font-size: 14px; padding: 7px 18px; border-radius: 9px; }
.y-btn:hover { filter: brightness(1.06); }
.y-eyebrow { margin: 6px 2px 0; display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--y-dim); }
.y-live { width: 7px; height: 7px; border-radius: 50%; background: var(--y-accent); box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.18); animation: y-pulse 2.4s ease-in-out infinite; }
@keyframes y-pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 210, 63, 0); } }
.y-feed { display: flex; flex-direction: column; gap: 10px; }
.y-post { background: var(--y-panel); border: 1px solid var(--y-line); border-radius: 14px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.y-post.mine { border-color: rgba(255, 210, 63, 0.45); }
.y-post header { display: flex; align-items: center; gap: 10px; min-width: 0; }
.y-who { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.y-name { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 15px; }
.y-name b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.y-handle, .y-time { font-family: var(--f-mono); font-size: 11.5px; color: var(--y-dim); }
.y-handle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.y-time { margin-left: auto; flex: none; }
.y-badge { display: inline-flex; width: 16px; height: 16px; color: var(--y-accent); flex: none; }
.y-badge svg { width: 100%; height: 100%; }
.y-post p { margin: 0; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.y-at, .y-link { color: var(--y-accent); text-decoration: none; }
.y-link:hover { text-decoration: underline; }
.y-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.y-act { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--y-line); background: none; color: var(--y-dim); font-family: var(--f-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.y-act svg { width: 14px; height: 14px; }
.y-act.views { margin-left: auto; border-color: transparent; }
button.y-act { cursor: pointer; }
button.y-act:hover { color: var(--y-like); border-color: rgba(255, 92, 122, 0.4); }
.y-act.like.on { color: var(--y-like); border-color: rgba(255, 92, 122, 0.5); background: rgba(255, 92, 122, 0.08); --heart-fill: var(--y-like); }
.y-none { padding: 24px 4px; color: var(--y-dim); margin: 0; }
.y-side { position: sticky; top: 76px; align-self: start; }
.y-card { background: var(--y-panel); border: 1px solid var(--y-line); border-radius: 14px; padding: 14px 16px 6px; }
.y-card h2 { margin: 0 0 6px; font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--y-dim); }
.y-trend { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-top: 1px solid var(--y-line); }
.y-trend:first-of-type { border-top: 0; }
.y-rank { font-family: var(--f-mono); font-size: 12px; color: var(--y-accent); padding-top: 2px; }
.y-trend span:last-child { display: flex; flex-direction: column; min-width: 0; }
.y-trend b { font-size: 14.5px; }
.y-trend small { font-family: var(--f-mono); font-size: 11px; color: var(--y-dim); }
.av { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: hsl(var(--h) 70% 88%); background: hsl(var(--h) 30% 26%); flex: none; }

/* ── Satchel: dark terminal-grade wallet ── */
.wl { min-height: 100%; background: radial-gradient(900px 400px at 85% -10%, rgba(76, 201, 240, 0.08), transparent 70%), var(--wl-bg); color: var(--wl-ink); }
.wl code, .wl-balance, .wl-sub, .wl-amt, .wl-table td, .wl-up b, .wl-net { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wl-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 24px; border-bottom: 1px solid var(--wl-line); background: rgba(7, 9, 13, 0.7); }
.wl-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: 0.01em; }
.wl-logo-tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(135deg, var(--wl-accent), var(--wl-accent-2)); }

.wl-net { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; color: var(--wl-dim); border: 1px solid var(--wl-line); padding: 4px 10px; border-radius: 6px; }
.wl-net i { width: 6px; height: 6px; border-radius: 50%; background: var(--wl-pos); box-shadow: 0 0 8px var(--wl-pos); }
.wl-acct { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; background: var(--wl-panel); border: 1px solid var(--wl-line); border-radius: 8px; padding: 4px 4px 4px 8px; font-size: 12.5px; }
.wl-ident { width: 20px; height: 20px; border-radius: 4px; background: hsl(var(--h) 30% 16%); padding: 2px; }
.wl-copy { border: 0; background: var(--wl-raise); color: var(--wl-ink); font-size: 11.5px; padding: 4px 10px; border-radius: 6px; }
.wl-copy:hover { background: var(--wl-line); }
.wl-wrap { max-width: 1000px; margin: 0 auto; padding: 22px 16px 40px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; }
.wl-hero { grid-column: 1 / -1; position: relative; border-radius: 16px; padding: 22px 24px 18px; background: linear-gradient(var(--wl-panel), var(--wl-panel)) padding-box, linear-gradient(120deg, rgba(76, 201, 240, 0.55), rgba(46, 230, 182, 0.15) 45%, var(--wl-line)) border-box; border: 1px solid transparent; display: flex; flex-direction: column; gap: 18px; }
.wl-hero-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: end; }
.wl-label { margin: 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--wl-dim); }
.wl-balance { margin: 6px 0 4px; font-size: clamp(34px, 5.5vw, 50px); font-weight: 500; letter-spacing: -0.03em; }
.wl-balance.neg { color: var(--wl-neg); }
.wl-sub { margin: 0; font-size: 12.5px; color: var(--wl-dim); display: flex; gap: 12px; flex-wrap: wrap; }
.wl-spark { width: 100%; height: 90px; display: block; }
.wl-spark .wl-line { fill: none; stroke: var(--wl-accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.wl-spark .wl-area { fill: rgba(76, 201, 240, 0.1); }
.wl-spark .wl-zero { stroke: var(--wl-line); stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
.wl-spark .wl-dot { fill: var(--wl-accent); stroke: var(--wl-panel); stroke-width: 2; vector-effect: non-scaling-stroke; }
.wl-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.wl-action { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--wl-line); background: var(--wl-raise); color: var(--wl-ink); border-radius: 10px; padding: 8px 16px 8px 8px; font-size: 13.5px; font-weight: 600; }
.wl-action span { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: rgba(76, 201, 240, 0.14); color: var(--wl-accent); font-weight: 700; }
.wl-action:hover { border-color: rgba(76, 201, 240, 0.5); }
.wl-panel { background: var(--wl-panel); border: 1px solid var(--wl-line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.wl-activity { grid-column: 1 / -1; }
.wl h2 { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--wl-dim); display: flex; justify-content: space-between; }
.wl h2 span { letter-spacing: 0; text-transform: none; font-weight: 400; }
.wl small { color: var(--wl-dim); font-size: 11.5px; }
.wl .neg { color: var(--wl-neg); }
.wl .pos { color: var(--wl-pos); }
.wl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.wl-table th { text-align: left; font-weight: 500; font-size: 11px; color: var(--wl-dim); padding: 0 0 8px; border-bottom: 1px solid var(--wl-line); }
.wl-table td { padding: 10px 0; border-bottom: 1px solid var(--wl-line); vertical-align: middle; }
.wl-table tr:last-child td { border-bottom: 0; }
.wl-table .r { text-align: right; padding-left: 10px; white-space: nowrap; }

.wl-asset { display: flex; align-items: center; gap: 10px; font-family: var(--f-ui); }

.wl-tok { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.wl-tok.dolr { background: rgba(76, 201, 240, 0.16); color: var(--wl-accent); box-shadow: inset 0 0 0 1px rgba(76, 201, 240, 0.4); }
.wl-tok.cat { background: rgba(255, 183, 77, 0.14); color: #ffb74d; box-shadow: inset 0 0 0 1px rgba(255, 183, 77, 0.35); }
.wl-up { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; padding: 10px 0; border-top: 1px solid var(--wl-line); font-size: 13.5px; }
.wl-up:first-of-type { border-top: 0; }

.wl-up small { grid-column: 1 / -1; }
.wl-list { list-style: none; margin: 0; padding: 0; }
.wl-tx { display: grid; grid-template-columns: 30px minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--wl-line); }

.wl-what, .wl-meta { display: flex; flex-direction: column; min-width: 0; }

/* ── Forkyard ── */
.fy { min-height: 100%; background: var(--fy-bg); color: var(--fy-ink); }
.fy-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--fy-line); background: var(--fy-panel); }
.fy-logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-weight: 500; font-size: 16px; }
.fy-logo svg { width: 22px; height: 22px; color: var(--fy-accent); }
.fy-user { font-size: 13px; color: var(--fy-dim); }
.fy-wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
.fy-h { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 10px; }
.fy-h span { font-size: 12px; background: var(--fy-line); padding: 2px 8px; border-radius: 999px; color: var(--fy-dim); }
.fy-repo { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 16px 18px; border: 1px solid var(--fy-line); border-radius: 8px; background: var(--fy-panel); }
.fy-repo > div:first-child { min-width: 0; flex: 1 1 260px; }
.fy-name { color: var(--fy-accent); font-weight: 600; font-size: 16px; font-family: var(--f-mono); }
.fy-repo p { margin: 6px 0; color: var(--fy-dim); font-size: 14px; }
.fy-repo small { color: var(--fy-dim); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.fy-lang { width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h) 70% 60%); display: inline-block; }
.fy-repo-act { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fy-pill { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--fy-line); color: var(--fy-dim); }
.fy-pill.on { color: var(--fy-live); border-color: color-mix(in srgb, var(--fy-live) 40%, transparent); }
.fy-url { color: var(--fy-ink); font-family: var(--f-mono); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; }
.fy-btn { border: 0; background: var(--fy-accent); color: #1a0a02; font-weight: 700; padding: 8px 18px; border-radius: 6px; }
.fy-btn:hover { filter: brightness(1.08); }
.fy-empty { border: 1px dashed var(--fy-line); border-radius: 8px; padding: 32px; text-align: center; color: var(--fy-dim); }
.fy-empty p { margin: 4px 0; }
.fy-empty b { color: var(--fy-ink); }
.fy-crumbs { margin: 0; font-family: var(--f-mono); font-size: 16px; }
.fy-crumbs a { color: var(--fy-accent); }
.fy-desc { margin: 0; color: var(--fy-dim); }
.fy-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.fy-files { border: 1px solid var(--fy-line); border-radius: 8px; overflow: hidden; min-width: 0; }
.fy-filehead { padding: 10px 14px; background: var(--fy-panel); font-size: 12.5px; color: var(--fy-dim); border-bottom: 1px solid var(--fy-line); }
.fy-filehead b { color: var(--fy-ink); }
.fy-file { padding: 8px 14px; border-bottom: 1px solid var(--fy-line); font-family: var(--f-mono); font-size: 12.5px; }
.fy-code { margin: 0; padding: 14px; overflow-x: auto; font-size: 12px; line-height: 1.6; color: #b8c2d0; background: #0a0c0f; }
.fy-deploy { border: 1px solid var(--fy-line); border-radius: 8px; padding: 16px; background: var(--fy-panel); display: flex; flex-direction: column; gap: 10px; }
.fy-deploy h2 { margin: 0; font-size: 14px; }
.fy-deploy p { margin: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fy-note { color: var(--fy-dim); font-size: 13px; }
.fy-deploy dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 13px; }
.fy-deploy dt { color: var(--fy-dim); }
.fy-deploy dd { margin: 0; font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.fy-deploy .fy-btn { align-self: flex-start; }

/* ── Unknown Agent ── */
.ua { height: 100%; display: flex; flex-direction: column; background: var(--ua-bg); color: var(--ua-ink); }
.ua-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 20px; background: var(--ua-panel); border-bottom: 1px solid var(--ua-line); }
.ua-brand { display: flex; align-items: center; gap: 12px; }
.ua-brand > svg { width: 36px; height: 36px; padding: 6px; border-radius: 10px; background: var(--ua-ink); color: #fff; flex: none; }
.ua-brand div { display: flex; flex-direction: column; }
.ua-brand b { font-family: var(--f-mono); font-weight: 500; font-size: 14px; }
.ua-brand span, .ua-linked { font-size: 12px; color: var(--ua-dim); }
.ua-log { flex: 1; min-height: 0; overflow-y: auto; padding: 24px max(16px, calc((100% - 720px) / 2)); display: flex; flex-direction: column; gap: 18px; }
.ua-msg { display: flex; gap: 12px; max-width: 100%; }
.ua-msg.you { flex-direction: column; align-items: flex-end; gap: 4px; }
.ua-bubble { background: var(--ua-you); color: #f2f3f5; padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: min(80%, 560px); font-size: 14.5px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
.ua-cost { font-family: var(--f-mono); font-size: 11px; color: #a12b1f; }
.ua-msg.agent { align-items: flex-start; flex-wrap: wrap; }
.ua-mark { width: 26px; height: 26px; flex: none; padding: 4px; border-radius: 8px; background: var(--ua-ink); color: #fff; margin-top: 1px; }
.ua-mark svg { width: 100%; height: 100%; }
.ua-text { flex: 1; min-width: 0; font-family: var(--f-mono); font-size: 13px; line-height: 1.75; overflow-wrap: anywhere; }
.ua-text code { background: #dfe2e6; padding: 1px 5px; border-radius: 3px; }
.ua-text.typing::after { content: '▍'; animation: blink 0.9s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.ua-src { display: none; flex-basis: 100%; margin-left: 36px; font-family: var(--f-mono); font-size: 10.5px; color: var(--ua-dim); }
body.dev-on .ua-src { display: block; }
.ua-src.hit { color: #1c7444; }
.ua-src.partial { color: #a06a00; }
.ua-src.miss { color: #a12b1f; }
.ua-sys { align-self: center; font-size: 12.5px; color: #a12b1f; background: #f8e3e0; padding: 6px 12px; border-radius: 6px; text-align: center; }
.ua-dots { display: flex; gap: 5px; align-items: center; height: 22px; }
.ua-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ua-dim); animation: dot 1s infinite ease-in-out; }
.ua-dots i:nth-child(2) { animation-delay: 0.15s; }
.ua-dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot { 0%, 100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
.ua-compose { padding: 12px max(16px, calc((100% - 720px) / 2)) 16px; background: var(--ua-bg); }
.ua-compose textarea { width: 100%; resize: none; border: 1px solid var(--ua-line); background: var(--ua-panel); border-radius: 12px; padding: 12px 14px; font-size: 15px; outline: 0; color: var(--ua-ink); }
.ua-compose textarea:focus { border-color: var(--ua-ink); }
.ua-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
.ua-est { font-family: var(--f-mono); font-size: 11.5px; color: var(--ua-dim); }
.ua-est.neg { color: #a12b1f; }
.ua-send { border: 0; background: var(--ua-ink); color: #fff; padding: 8px 20px; border-radius: 8px; font-weight: 600; }
.ua-send:disabled, .ua-compose textarea:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── deployed app previews & error page ── */
.pv-host { min-height: 100%; background: #fff; color: #222; }
.pv { max-width: 780px; margin: 0 auto; padding: 40px 20px; }
.pv h1 { margin: 0; font-size: 40px; }
.pv h2 { font-size: 18px; margin: 18px 0 6px; }
.pv-sub { color: #666; margin: 6px 0 20px; }
.pv-bakery { font-family: var(--f-display); color: #3a2414; }
.pv-bakery h1 { font-style: italic; font-size: 52px; }
.pv-bakery ul { list-style: none; padding: 0; margin: 0; }
.pv-bakery li { display: flex; justify-content: space-between; border-bottom: 1px dotted #c9b29b; padding: 6px 0; }
.pv-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; font-family: var(--f-ui); }
.pv-spin { font-family: var(--f-ui); }
.pv-spin h1 { font-family: var(--f-mono); font-size: 32px; font-weight: 500; }
.pv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.pv-m { border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px; border: 2px solid; }
.pv-m b { font-family: var(--f-mono); font-size: 18px; }
.pv-m span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.pv-m.ok { border-color: #2e9d5b; background: #e9f7ee; color: #1d6b3c; }
.pv-m.bad { border-color: #d4d4d4; background: #f4f4f4; color: #888; }
.err { min-height: 100%; background: var(--chrome-2); color: var(--chrome-ink); padding: 60px 24px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; max-width: 640px; margin: 0 auto; }
.err h1 { margin: 0 0 6px; font-size: 26px; }
.err p { margin: 0; color: var(--chrome-dim); }
.err-sub { font-style: italic; }

/* ── narrow screens ── */
@media (max-width: 1000px) { .y-cols { grid-template-columns: minmax(0, 620px); } .y-side { display: none; } }
@media (max-width: 760px) {
  .desk { padding-block: 8px 4px; }
  .y-bar { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
  .y-search { order: 2; width: auto; flex: 1; margin-left: 0; }
  .y-pills { order: 3; width: 100%; }
  .y-cols { padding: 12px 10px 28px; }
  .wl-wrap, .fy-grid, .wl-hero-top { grid-template-columns: minmax(0, 1fr); }
  .wl-top { padding: 10px 12px; }
  .wl-acct { margin-left: 0; }
  .wl-tx { grid-template-columns: 30px minmax(0, 1fr) auto; }
  .wl-meta { display: none; }
  .wl-table th:nth-child(2), .wl-table td:nth-child(2), .wl-table th:nth-child(3), .wl-table td:nth-child(3) { display: none; }
  .bm-label { display: none; }
  .bm { padding: 6px 12px; }
  .tb-dots { display: none; }
  .tab { flex-basis: 150px; }
  .nt-tiles { grid-template-columns: repeat(3, minmax(0, 110px)); }
  .tk-rent { display: none; }
  .tk-note { flex-basis: 100%; }
  .tk-right { width: 100%; justify-content: space-between; gap: 8px; }
  .ov-card { padding: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ── local model control (agent page) ── */
.ua-llm { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 8px 20px; background: var(--ua-panel); border-bottom: 1px solid var(--ua-line); font-size: 12.5px; color: var(--ua-dim); }
.ua-jev { display: flex; align-items: center; gap: 8px; color: var(--ua-ink); font-weight: 500; padding-right: 14px; border-right: 1px solid var(--ua-line); }
.ua-llm-ctl { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; flex: 1 1 360px; min-width: 0; }

.dv-bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--ok); vertical-align: middle; }

.ua-llm-bar i { display: block; height: 100%; background: var(--ua-ink); transition: width 0.3s; }
.ua-llm-dot { width: 8px; height: 8px; border-radius: 50%; background: #1c9a55; flex: none; }
.ua-llm-err { color: #a12b1f; }
.ua-llm-btn { border: 0; background: var(--ua-ink); color: #fff; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.ua-llm-btn.ghost { background: none; color: var(--ua-ink); border: 1px solid var(--ua-line); }
.ua-model { flex-basis: 100%; margin-left: 36px; font-size: 10.5px; color: var(--ua-dim); font-family: var(--f-mono); }
.dv-probs td:last-child { width: 45%; }

/* ── GIT models: picker and pricing page ── */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ua-row .ua-est { flex: 1; min-width: 0; }
.ua-model-pick select { border: 1px solid var(--ua-line); background: var(--ua-panel); color: var(--ua-ink); border-radius: 8px; padding: 6px 8px; font-family: var(--f-mono); font-size: 12px; }
.ua-upgrade { color: var(--ua-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.ua-src.locked { color: #6a3fb3; }
.gm { overflow-y: auto; }
.gm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(210px, 100%), 1fr)); gap: 14px; padding: 24px max(16px, calc((100% - 1100px) / 2)) 8px; }
.gm-card { background: var(--ua-panel); border: 1px solid var(--ua-line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }

.gm-card header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gm-card h2 { margin: 0; font-family: var(--f-mono); font-weight: 500; font-size: 18px; }
.gm-meter { display: flex; gap: 3px; }
.gm-meter i { width: 6px; height: 14px; border-radius: 2px; background: var(--ua-line); }
.gm-meter i.on { background: var(--ua-ink); }
.gm-card p { margin: 0; color: var(--ua-dim); font-size: 13.5px; line-height: 1.45; flex: 1; }
.gm-card dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.gm-card dt { color: var(--ua-dim); }
.gm-card dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.gm-act { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.gm-act small { color: #a12b1f; font-size: 11.5px; }
.gm-btn { border: 0; background: var(--ua-ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; }

<script>
/*
 * Keywords — the offline story-branch decider for Unknown Agent.
 *
 * Jev (src/jev.js) makes the real decisions. This matcher takes over when no Jev
 * server is reachable (no API key, or the published page). It reads the player's
 * prompt, compares it to the branches the story offers right now, and picks one:
 *
 *   hit      every `all` group matched     → the branch's response + effects
 *   partial  at least half of `all` matched → the branch's `partial` nudge
 *   miss     nothing close                  → Jev.fallback(prompt, ctx)
 *
 * Branch rule format (see README.md for the full story format):
 *
 *   match: {
 *     all:  [["build","make","code"], ["site","website"]],  // every group needs a hit
 *     any:  ["menu","hours"],                                // tie-break bonus
 *     none: ["delete","hack"],                               // any hit vetoes the branch
 *   }
 *
 * Keywords are matched on light stems with typo tolerance, so "websites",
 * "website" and "webiste" all hit "site". A keyword containing a space is a
 * phrase ("landing page"). A keyword written "/like this/" is a regex tested
 * against the raw lowercased prompt.
 */
(function (global) {
  'use strict';

  function stem(w) {
    if (w.length <= 3) return w;
    if (w.endsWith('ies') && w.length > 4) return w.slice(0, -3) + 'y';
    if (w.endsWith('ing') && w.length > 5) w = w.slice(0, -3);
    else if (w.endsWith('ed') && w.length > 4) w = w.slice(0, -2);
    else if (w.endsWith('es') && w.length > 4 && /(sh|ch|x|ss|z)es$/.test(w)) w = w.slice(0, -2);
    else if (w.endsWith('s') && !w.endsWith('ss') && w.length > 3) w = w.slice(0, -1);
    if (w.endsWith('e') && w.length > 3) w = w.slice(0, -1);
    return w;
  }

  function tokenize(text) {
    return String(text)
      .toLowerCase()
      .replace(/[’']/g, '')
      .split(/[^a-z0-9]+/)
      .filter(Boolean);
  }

  function editDistanceAtMostOne(a, b) {
    if (a === b) return true;
    const la = a.length, lb = b.length;
    if (Math.abs(la - lb) > 1) return false;
    let i = 0, j = 0, edits = 0;
    while (i < la && j < lb) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++edits > 1) return false;
      if (la > lb) i++;
      else if (lb > la) j++;
      else {
        // allow a single adjacent transposition ("webiste")
        if (a[i + 1] === b[j] && a[i] === b[j + 1]) { i += 2; j += 2; continue; }
        i++; j++;
      }
    }
    return edits + (la - i) + (lb - j) <= 1;
  }

  function analyze(prompt) {
    const raw = String(prompt || '');
    const tokens = tokenize(raw);
    const stems = tokens.map(stem);
    return { raw, lower: raw.toLowerCase(), tokens, stems, joined: ' ' + stems.join(' ') + ' ' };
  }

  function keywordHits(kw, a) {
    if (kw.length > 2 && kw[0] === '/' && kw[kw.length - 1] === '/') {
      try { return new RegExp(kw.slice(1, -1), 'i').test(a.lower); } catch (e) { return false; }
    }
    const parts = tokenize(kw).map(stem);
    if (!parts.length) return false;
    if (parts.length > 1) return a.joined.includes(' ' + parts.join(' ') + ' ');
    const k = parts[0];
    for (const s of a.stems) {
      if (s === k) return true;
      if (k.length >= 5 && s.length >= 5 && editDistanceAtMostOne(s, k)) return true;
    }
    return false;
  }

  function groupHit(group, a) {
    const list = Array.isArray(group) ? group : [group];
    for (const kw of list) if (keywordHits(kw, a)) return kw;
    return null;
  }

  // Score one branch against an analyzed prompt.
  function scoreBranch(branch, a) {
    const m = branch.match || {};
    const all = m.all || [];
    const any = m.any || [];
    const none = m.none || [];
    const hits = [], misses = [];
    for (const g of none) {
      const kw = groupHit(g, a);
      if (kw) return { branch, vetoed: kw, coverage: 0, score: -1, hits, misses };
    }
    all.forEach((g, idx) => {
      const kw = groupHit(g, a);
      if (kw) hits.push(kw); else misses.push(idx);
    });
    let bonus = 0;
    for (const g of any) if (groupHit(g, a)) bonus++;
    const coverage = all.length ? hits.length / all.length : 0;
    const score = hits.length * 10 + bonus + (branch.priority || 0);
    return { branch, coverage, score, hits, misses, bonus, groups: all.length };
  }

  const Keywords = {
    analyze,
    stem,
    tokenize,
    scoreBranch,

    /*
     * Decide what a prompt does.
     *   branches: candidate branches, already filtered by their `when`
     *   returns { kind: 'hit' | 'partial' | 'miss', branch?, report }
     */
    decide(prompt, branches) {
      const a = analyze(prompt);
      const report = branches.map((b) => scoreBranch(b, a));
      const ranked = report
        .filter((r) => !r.vetoed && r.groups > 0)
        .sort((x, y) => (y.coverage - x.coverage) || (y.score - x.score) || (y.groups - x.groups));
      const best = ranked[0];
      if (best && best.coverage === 1) return { kind: 'hit', branch: best.branch, report };
      const partial = ranked.find((r) => r.coverage >= 0.5 && r.branch.partial);
      if (partial) return { kind: 'partial', branch: partial.branch, report };
      return { kind: 'miss', report };
    },
  };

  if (typeof module !== 'undefined') module.exports = Keywords;

<script>
/*
 * Jev — decides where the player's prompt takes the story.
 *
 * Jev is TypeSafe's System One model. For every prompt (and every Y post or Qmail email) the game
 * asks it one Choice question: which of the branches available right now does
 * this carry out, or none (`no_progress`)? Jev answers with a probability for
 * each option, and the story's `decision` thresholds turn those into:
 *
 *   hit      top branch ≥ decision.hit         → response + effects
 *   partial  a branch with a `partial` nudge
 *            ≥ decision.partial                → the nudge
 *   miss     no progress                       → Jev.fallback (local model or placeholder)
 *
 * The API key lives in server.mjs; this file only talks to /api/decide. When no
 * server or key is available (opening index.html directly, the published page),
 * decisions fall back to the offline keyword matcher in keywords.js.
 */
(function (global) {
  'use strict';

  const NO_PROGRESS = 'no_progress';
  const listeners = new Set();
  let ready = null;

  const Jev = {
    NO_PROGRESS,
    status: 'checking',   // checking | online | offline
    model: null,
    reason: '',           // why decisions are offline
    last: null,           // { ms, model, error } of the most recent call

    onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); },

    init() {
      if (ready) return ready;
      ready = (async () => {
        try {
          const res = await withTimeout(fetch('api/status', { headers: { Accept: 'application/json' } }), 4000);
          const data = res && res.ok ? await res.json() : null;
          if (data && data.jev) set({ status: 'online', model: data.model, reason: '' });
          else if (data) set({ status: 'offline', reason: 'The server has no TYPESAFE_API_KEY.' });
          else set({ status: 'offline', reason: 'No Jev server. Run npm start to use Jev.' });
        } catch (e) {
          set({ status: 'offline', reason: 'No Jev server. Run npm start to use Jev.' });
        }
      })();
      return ready;
    },

    /*
     * Decide what a prompt does.
     *   branches: candidate branches, already filtered by their `when`
     *   opts: { kind: 'prompt' | 'post' | 'mail', node, thresholds: { hit, partial } }
     *   returns { kind: 'hit' | 'partial' | 'miss', branch?, engine, probabilities?, report? }
     */
    async decide(prompt, branches, opts) {
      opts = opts || {};
      await this.init();
      if (this.status === 'online' && branches.length) {
        const started = performance.now();
        try {
          const res = await withTimeout(fetch('api/decide', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kind: opts.kind || 'prompt', node: opts.node, prompt, candidates: branches.map((b) => b.id) }),
          }), 12000);
          if (!res) throw new Error('Jev timed out');
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          this.last = { ms: Math.round(performance.now() - started), model: data.model, error: null };
          emit();
          return Object.assign(interpret(data, branches, opts.thresholds), { engine: 'jev', probabilities: data.probabilities, choice: data.choice });
        } catch (err) {
          this.last = { ms: Math.round(performance.now() - started), model: null, error: String(err.message || err) };
          emit();
          // fall through: keep the game playable if one call fails
        }
      }
      const d = global.Keywords.decide(prompt, branches);
      d.engine = 'keywords';
      if (this.status === 'online') d.fellBack = true;
      return d;
    },

    // What the agent says when nothing progresses. llm.js wraps this with a local model.
    async fallback(prompt, ctx) {
      const pool = (ctx && ctx.placeholders) || ['I am not sure what you mean.'];
      // deterministic per prompt, so asking the same thing twice is consistently useless
      let h = 0;
      for (const ch of String(prompt).toLowerCase().replace(/\s+/g, ' ').trim()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return pool[h % pool.length];
    },
  };

  // Turn Jev's probabilities into a story outcome.
  function interpret(data, branches, thresholds) {
    const th = Object.assign({ hit: 0.5, partial: 0.2 }, thresholds);
    const p = data.probabilities || {};
    const byId = new Map(branches.map((b) => [b.id, b]));
    const top = data.choice;
    const topP = p[top] != null ? p[top] : data.confidence;
    if (top !== NO_PROGRESS && byId.has(top) && topP >= th.hit) return { kind: 'hit', branch: byId.get(top) };
    const nudge = branches
      .filter((b) => b.partial && (p[b.id] || 0) >= th.partial)
      .sort((a, b) => p[b.id] - p[a.id])[0];
    if (nudge) return { kind: 'partial', branch: nudge };
    return { kind: 'miss' };
  }

  /*
   * Model gating. A branch with `minModel: n` needs agent-n or better: on a weaker
   * model a hit becomes 'locked' (the player still pays, nothing happens, and the
   * agent says which tier it needs). Nudges and misses pass through unchanged.
   */
  Jev.gate = function (decision, level) {
    if (decision.kind === 'hit' && decision.branch && (decision.branch.minModel || 1) > level) {
      return Object.assign({}, decision, { kind: 'locked' });
    }
    return decision;
  };

  // The response and effects a branch produces at a model tier, honouring `atModel` upgrades.
  Jev.outcome = function (branch, level) {
    let out = { response: branch.response, effects: branch.effects };
    const tiers = Object.keys(branch.atModel || {}).map(Number).filter((n) => n <= level).sort((a, b) => a - b);
    for (const n of tiers) out = Object.assign({}, out, branch.atModel[n]);
    return out;
  };

  function withTimeout(promise, ms) {
    return Promise.race([promise, new Promise((resolve) => setTimeout(() => resolve(null), ms))]);

  function emit() { for (const fn of listeners) { try { fn(Jev); } catch (e) { console.error(e); } } }

  Jev._interpret = interpret;
  global.Jev = Jev;
  if (typeof module !== 'undefined') module.exports = Jev;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/*
 * LocalLLM — a tiny local model for the agent's non-story replies.
 *
 * jev still decides every story beat. Only prompts that miss every branch reach
 * Jev.fallback, and this file routes those to Gemma 3 270M, running either:
 *
 *   browser  in a Web Worker via transformers.js (WebGPU if available, else WASM).
 *            Weights download once from Hugging Face and stay in the browser cache.
 *   ollama   through a local Ollama server (`ollama pull gemma3:270m`).
 *
 * If the model is off, still loading, slow or broken, the reply falls back to the
 * story's canned placeholders, so the game never waits on it.
 */
(function (global) {
  'use strict';

  const CONFIG = {
    transformersUrl: 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0/dist/transformers.min.js',
    browserModel: 'onnx-community/gemma-3-270m-it-ONNX',
    ollamaUrl: 'http://localhost:11434',
    ollamaModel: 'gemma3:270m',
    maxTokens: 72,
    replyTokens: 120,
    temperature: 0.9,
    timeoutMs: 25000,
  };
  const SETTINGS_KEY = 'unknown-agent-llm';

  // Runs inside the worker. Kept as a function so it is real, lintable code; it is stringified below.
  function workerMain() {
    let generator = null;
    const post = (m) => self.postMessage(m);

    async function load(msg) {
      const tf = await import(msg.lib);
      tf.env.allowLocalModels = false;
      let device = 'wasm';
      try {
        if (self.navigator && navigator.gpu && (await navigator.gpu.requestAdapter())) device = 'webgpu';
      } catch (e) { /* no WebGPU */ }
      // smallest weights first; fall through if a variant is missing or fails to init
      const chain = device === 'webgpu' ? ['q4f16', 'q4', 'fp32'] : ['q4', 'q8', 'fp32'];
      let lastErr = null;
      for (const dtype of chain) {
        try {
          generator = await tf.pipeline('text-generation', msg.model, {
            device,
            dtype,
            progress_callback: (p) => {
              if (p.status === 'progress_total') post({ type: 'progress', progress: p.progress, loaded: p.loaded, total: p.total });
            },
          });
          post({ type: 'ready', device, dtype });
          return;
        } catch (err) {
          lastErr = err;
          post({ type: 'log', text: `${device}/${dtype} failed: ${err && err.message}` });
        }
      }
      throw lastErr || new Error('No model variant could be loaded');
    }

    self.onmessage = async (e) => {
      const msg = e.data;
      if (msg.type === 'load') {
        try { await load(msg); } catch (err) { post({ type: 'error', message: String((err && err.message) || err) }); }
      } else if (msg.type === 'generate') {
        try {
          const out = await generator(msg.messages, {
            max_new_tokens: msg.maxTokens,
            do_sample: true,
            temperature: msg.temperature,
            top_p: 0.95,
            top_k: 64,
            repetition_penalty: 1.15,
          });
          const last = out[0].generated_text;
          const text = Array.isArray(last) ? last[last.length - 1].content : String(last);
          post({ type: 'result', id: msg.id, text });
        } catch (err) {
          post({ type: 'result', id: msg.id, error: String((err && err.message) || err) });
        }
      }
    };
  }

  // ───────────────────────── state ─────────────────────────

  const listeners = new Set();
  const pending = new Map();
  let worker = null;
  let nextId = 1;

  const LLM = {
    config: CONFIG,
    settings: loadSettings(),
    status: 'off',      // off | loading | ready | error
    progress: 0,        // 0–100 while loading
    loadedBytes: 0,
    totalBytes: 0,
    detail: '',         // e.g. "webgpu · q4f16", or an error message
    last: null,         // { ms, ok, text } for the dev panel

    onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); },

    label() {
      return this.settings.backend === 'ollama' ? `Gemma 3 270M via Ollama` : 'Gemma 3 270M';
    },

    setBackend(backend) {
      if (backend === this.settings.backend) return;
      this.unload();
      this.settings.backend = backend;
      this.settings.autoload = false;
      saveSettings(this.settings);
      if (backend === 'ollama') this.load();
      emit();
    },

    load() {
      const b = this.settings.backend;
      if (b === 'off' || this.status === 'loading' || this.status === 'ready') return;
      if (b === 'browser') loadBrowser();
      else if (b === 'ollama') loadOllama();
    },

    unload() {
      if (worker) { worker.terminate(); worker = null; }
      for (const p of pending.values()) p.resolve(null);
      pending.clear();
      set({ status: 'off', progress: 0, detail: '' });
    },

    // Resolve to a reply string, or null if the model can't answer right now.
    async generate(prompt, ctx) {
      return run(buildMessages(prompt, ctx), CONFIG.maxTokens, clean);
    },

    /*
     * Write the body of an email reply in a contact's voice, or resolve to null
     * when no model is ready. contact: { persona, examples? }; email: { fromName, subject, body }.
     */
    async writeReply(contact, email) {
      const messages = [{
        role: 'system',
        content: `${contact.persona}\nWrite only the body of your reply email: two to four short sentences of plain text. ` +
          'No subject line, no greeting header, no signature. Never give the reader advice or suggest what they should do next.',
      }];
      for (const [u, a] of contact.examples || []) messages.push({ role: 'user', content: u }, { role: 'assistant', content: a });
      messages.push({ role: 'user', content: `Email from ${email.fromName}\nSubject: ${email.subject}\n\n${email.body}`.slice(0, 900) });
      return run(messages, CONFIG.replyTokens, cleanEmail);
    },
  };

  async function run(messages, maxTokens, finish) {
    if (LLM.status !== 'ready') return null;
    const started = performance.now();
    let raw = null;
    try {
      raw = LLM.settings.backend === 'ollama'
        ? await withTimeout(ollamaChat(messages, maxTokens), CONFIG.timeoutMs)
        : await withTimeout(workerGenerate(messages, maxTokens), CONFIG.timeoutMs);
    } catch (e) {
      raw = null;
    }
    const text = raw ? finish(raw) : null;
    LLM.last = { ms: Math.round(performance.now() - started), ok: !!text, text: text || raw || '' };
    emit();
    return text;
  }

  // Once a backend has worked, bring it back automatically on the next visit.
  function rememberReady() {
    LLM.settings.autoload = true;
    saveSettings(LLM.settings);
  }

  function emit() { for (const fn of listeners) { try { fn(LLM); } catch (e) { console.error(e); } } }
  function set(patch) { Object.assign(LLM, patch); emit(); }

  function loadSettings() {
    const d = { backend: 'browser', autoload: false, ollamaUrl: CONFIG.ollamaUrl, ollamaModel: CONFIG.ollamaModel };
    try { return Object.assign(d, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) { return d; }
  }
  function saveSettings(s) {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) { /* storage unavailable */ }
  }

  function withTimeout(p, ms) {
    return Promise.race([p, new Promise((resolve) => setTimeout(() => resolve(null), ms))]);
  }

  // ───────────────────────── prompting ─────────────────────────

  function buildMessages(prompt, ctx) {
    const agent = (global.STORY && global.STORY.agent) || {};
    const persona = agent.llmPersona ||
      'You are a pay-per-prompt AI chatbot called agent. Reply in one or two short sentences.';
    const facts = ctx && ctx.state
      ? `\nThe user's wallet balance is $${ctx.state.money.toFixed(2)}.` + (ctx.state.lastCost ? ` That prompt cost them $${ctx.state.lastCost.toFixed(2)}.` : '')
      : '';
    const messages = [{ role: 'system', content: persona + facts }];
    for (const [u, a] of agent.llmExamples || []) {
      messages.push({ role: 'user', content: u }, { role: 'assistant', content: a });
    }
    messages.push({ role: 'user', content: String(prompt).slice(0, 600) });
    return messages;
  }

  // Small models ramble and love markdown. Keep at most two sentences of plain text.
  function clean(text) {
    let t = String(text)
      .replace(/<end_of_turn>|<eos>|<\/?start_of_turn>(model|user)?/g, '')
      .replace(/[*_#`]+/g, '')
      .replace(/^\s*(assistant|model|agent|unknown agent)\s*:\s*/i, '')
      .replace(/\s+/g, ' ')
      .trim();
    // drop a half-finished trailing sentence (generation hit the token limit)
    const sentences = t.match(/[^.!?]+[.!?]+["')\]]*/g);
    if (sentences) t = sentences.slice(0, 2).join('').trim();
    if (t.length > 320) t = t.slice(0, 317).replace(/\s+\S*$/, '') + '…';
    return t.length >= 2 ? t : null;
  }

  // Email bodies may run a little longer, but never carry their own subject or sign-off.
  function cleanEmail(text) {
    let t = String(text)
      .replace(/<end_of_turn>|<eos>|<\/?start_of_turn>(model|user)?/g, '')
      .replace(/[*_#`]+/g, '')
      .replace(/^\s*(subject|re)\s*:.*$/gim, '')
      .replace(/^\s*(love|best|regards|cheers|thanks|sincerely|xo)[^\n]{0,30},?\s*\n?[^\n]{0,30}\s*$/im, '')
      .replace(/\s+/g, ' ')
      .trim();
    const sentences = t.match(/[^.!?]+[.!?]+["')\]]*/g);
    if (sentences) t = sentences.slice(0, 4).join('').trim();
    if (t.length > 480) t = t.slice(0, 477).replace(/\s+\S*$/, '') + '…';
    return t.length >= 2 ? t : null;
  }

  // ───────────────────────── browser backend ─────────────────────────

  function loadBrowser() {
    set({ status: 'loading', progress: 0, loadedBytes: 0, totalBytes: 0, detail: 'Starting…' });
    try {
      const src = `(${workerMain.toString()})();`;
      const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      worker = new Worker(url, { type: 'module' });
    } catch (err) {
      set({ status: 'error', detail: `Couldn't start a worker: ${err.message}` });
      return;
    }
    worker.onmessage = (e) => {
      const m = e.data;
      if (m.type === 'progress') set({ progress: m.progress, loadedBytes: m.loaded, totalBytes: m.total, detail: 'Downloading' });
      else if (m.type === 'ready') { rememberReady(); set({ status: 'ready', progress: 100, detail: `${m.device} · ${m.dtype}` }); }
      else if (m.type === 'log') console.info('[LocalLLM]', m.text);
      else if (m.type === 'error') {
        if (worker) { worker.terminate(); worker = null; }
        set({ status: 'error', detail: explain(m.message) });
      } else if (m.type === 'result') {
        const p = pending.get(m.id);
        if (!p) return;
        pending.delete(m.id);
        if (m.error) console.warn('[LocalLLM] generation failed:', m.error);
        p.resolve(m.error ? null : m.text);
      }
    };
    worker.onerror = (e) => {
      if (worker) { worker.terminate(); worker = null; }
      set({ status: 'error', detail: explain(e.message || 'Worker crashed') });
    };
    worker.postMessage({ type: 'load', lib: CONFIG.transformersUrl, model: CONFIG.browserModel });
  }

  function workerGenerate(messages, maxTokens) {
    if (!worker) return Promise.resolve(null);
    const id = nextId++;
    return new Promise((resolve) => {
      pending.set(id, { resolve });
      worker.postMessage({ type: 'generate', id, messages, maxTokens: maxTokens || CONFIG.maxTokens, temperature: CONFIG.temperature });
    });
  }

  function explain(msg) {
    const m = String(msg || '');
    if (/fetch|network|import|load failed|cors|blocked/i.test(m)) {
      return "Couldn't download the model. This page may not be allowed to reach Hugging Face; run the game locally with npm start.";
    }
    return m.slice(0, 200);
  }

  // ───────────────────────── ollama backend ─────────────────────────

  async function loadOllama() {
    const { ollamaUrl, ollamaModel } = LLM.settings;
    set({ status: 'loading', progress: 0, detail: `Connecting to ${ollamaUrl}` });
    try {
      const res = await fetch(`${ollamaUrl}/api/tags`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const names = (data.models || []).map((m) => m.name);
      const has = names.some((n) => n === ollamaModel || n === ollamaModel + ':latest');
      if (!has) { set({ status: 'error', detail: `Ollama is running but ${ollamaModel} isn't pulled. Run: ollama pull ${ollamaModel}` }); return; }
      rememberReady();
      set({ status: 'ready', progress: 100, detail: `${ollamaModel} · ${ollamaUrl.replace(/^https?:\/\//, '')}` });
    } catch (err) {
      set({ status: 'error', detail: `No Ollama server at ${ollamaUrl}. Start it with: ollama serve` });
    }
  }

  async function ollamaChat(messages, maxTokens) {
    const { ollamaUrl, ollamaModel } = LLM.settings;
    const res = await fetch(`${ollamaUrl}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: ollamaModel,
        messages,
        stream: false,
        options: { num_predict: maxTokens || CONFIG.maxTokens, temperature: CONFIG.temperature, top_p: 0.95, top_k: 64, repeat_penalty: 1.15 },
      }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data && data.message ? data.message.content : null;
  }

  // ───────────────────────── wire into jev ─────────────────────────

  if (global.Jev) {
    const placeholder = global.Jev.fallback.bind(global.Jev);
    global.Jev.fallback = async function (prompt, ctx) {
      const text = await LLM.generate(prompt, ctx);
      if (text) { if (ctx) ctx.source = 'llm'; return text; }
      if (ctx) ctx.source = 'placeholder';
      return placeholder(prompt, ctx);
    };
  }

  global.LocalLLM = LLM;
  // the exported clean() is handy for tests
  LLM._clean = clean;
  LLM._buildMessages = buildMessages;
  LLM._cleanEmail = cleanEmail;

  if (LLM.settings.autoload && LLM.settings.backend !== 'off') {
    // weights come from the browser cache after the first download
    setTimeout(() => LLM.load(), 0);
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>

 */
(function () {
  'use strict';

  const S = window.STORY;
  const J = window.Jev;          // story decisions (TypeSafe Jev, via server.mjs)
  const K = window.Keywords;     // offline keyword matcher, also used for word counts
  const LLM = window.LocalLLM || null;
  const E = S.economy;
  const SAVE_KEY = 'unknown-agent-save-v1';
  const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  const SITES = {

  let state = null;

  let devOpen = false;
  let draft = null;          // the Qmail message being written: { to, subject, body }

  // ───────────────────────── utils ─────────────────────────

  const $ = (sel, root) => (root || document).querySelector(sel);
  const arr = (x) => (x == null ? [] : Array.isArray(x) ? x : [x]);
  const round2 = (n) => Math.round(n * 100) / 100;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtMoney(n) {
    const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (n < 0 ? '−$' : '$') + s;

  // Satchel holds DOLR, a stablecoin pegged 1:1 to the dollar.

    return `${n < 0 ? '−' : ''}${s} DOLR`;
  }
  const WALLET_ADDR = '0x4417c3e8b1d05f2a9e6d7b0c1f83a4e5d2b9a9f2';
  const shortAddr = (a) => `${a.slice(0, 6)}…${a.slice(-4)}`;
  const dayOf = (t) => Math.floor(t / 1440) + 1;
  const hourOf = (t) => (t % 1440) / 60;
  function clock(t) {
    const m = ((t % 1440) + 1440) % 1440;
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }
  const weekday = (t) => DAYS[(dayOf(t) - 1 + 7 * 100) % 7];
  const stamp = (t) => `Day ${dayOf(t)} · ${clock(t)}`;
  function ago(t) {
    const d = state.t - t;
    if (d < 1) return 'now';
    if (d < 60) return d + 'm';

  function tpl(s, extra) {

      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');

  function hashHue(s) {
    let h = 0;

  function avatar(name, handle) {

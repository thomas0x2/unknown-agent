name: wiki-pages

# Publishes the world wiki (app/wiki.html, read-only) to GitHub Pages on every push to main that
# touches the app, so it can be read on a phone. Needs Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/wiki-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build:wiki
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist-wiki

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

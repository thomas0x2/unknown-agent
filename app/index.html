<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unknown Agent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap">
</head>
<body>
<!-- Same shell as the legacy game (../index.html): the view fills these slots. -->
<div id="app">
  <div class="desk">
    <div class="window" role="application" aria-label="Browser">
      <div class="tabstrip" id="tabs" role="tablist"></div>
      <form class="toolbar" data-form="url">
        <span class="tb-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="tb-nav">
          <button type="button" class="tb-btn" id="nav-back" data-back aria-label="Back" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button type="button" class="tb-btn" id="nav-fwd" data-forward aria-label="Forward" title="Forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </span>
        <label class="addr">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3h1v10H6V11h1zm2 0h6V8a3 3 0 0 0-6 0v3z" fill="currentColor"/></svg>
          <input id="address" autocomplete="off" spellcheck="false" aria-label="Address">
        </label>
      </form>
      <nav class="bookmarks" id="bookmarks" aria-label="Bookmarks"></nav>
      <div class="viewport" id="viewport"></div>
    </div>
    <section class="term-win" id="termwin" role="dialog" aria-label="Terminal" hidden></section>
  </div>
  <footer class="taskbar dk-bar">
    <button class="dk-home" id="dk-home" data-start aria-haspopup="menu" aria-expanded="false" title="Home menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2M6 9.6V20h4.5v-5.5h3V20H18V9.6"/></svg><span>Home</span></button>
    <div class="dk-tasks" id="dk-tasks"></div>
    <div class="dk-tray">
      <span class="dk-tray-icons" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.3a9.5 9.5 0 0 1 13 0M8.6 15.5a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19" r="1.3" class="fill"/></svg>
        <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" class="fill"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
        <svg viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="17" height="9" rx="2"/><rect x="4.5" y="9.5" width="9" height="5" rx="1" class="fill"/><path d="M21.5 10.5v3"/></svg>
      </span>
      <span class="dk-clock" id="clock"></span>
    </div>
  </footer>
  <nav class="dk-menu" id="startmenu" role="menu" aria-label="Home menu" hidden></nav>
  <div id="toasts" aria-live="polite"></div>
  <div id="overlay" hidden></div>
  <aside id="dev" hidden></aside>
  <aside id="devedit" hidden></aside>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

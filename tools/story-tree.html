<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--build:head-->
<title>Unknown Agent Story Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working document for the story author. Header with counts and legend, the node graph
   (one section per day, nodes top to bottom, edges labelled by trigger), a detail panel for the
   selected node, then reference tables. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #14161a; --dim: #626a76; --line: #dfe2e7; --soft: #eef0f3;
  --k-prompt: #14161a; --k-deploy: #d9480f; --k-post: #a67c00; --k-mail: #3b4ad6; --k-day: #7c3aed; --k-timer: #626a76;
  --sel: #3b4ad6; --warn: #b42318; --k-meter: #0f7b6c;
  --f-ui: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1115; --panel: #171a20; --ink: #e8eaee; --dim: #8b93a0; --line: #2a2f38; --soft: #1e222a;
  --k-prompt: #e8eaee; --k-deploy: #ff8a4c; --k-post: #ffd23f; --k-mail: #8b96ff; --k-day: #b794f6; --k-timer: #8b93a0;
  --sel: #8b96ff; --warn: #ff8a80; --k-meter: #4fd1b5; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a20; --ink: #e8eaee; --dim: #8b93a0; --line: #2a2f38; --soft: #1e222a;
  --k-prompt: #e8eaee; --k-deploy: #ff8a4c; --k-post: #ffd23f; --k-mail: #8b96ff; --k-day: #b794f6; --k-timer: #8b93a0;
  --sel: #8b96ff; --warn: #ff8a80; --k-meter: #4fd1b5; color-scheme: dark;
}
* , *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
.page { max-width: 1400px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font-size: 24px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.top p { margin: 4px 0 0; color: var(--dim); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; display: flex; flex-direction: column; min-width: 92px; }
.stat b { font-family: var(--f-mono); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--dim); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; font-family: var(--f-mono); font-size: 10.5px; white-space: nowrap; background: var(--panel); }
.chip.prompt { color: var(--k-prompt); } .chip.deploy { color: var(--k-deploy); } .chip.post { color: var(--k-post); }
.chip.mail { color: var(--k-mail); } .chip.day { color: var(--k-day); } .chip.timer { color: var(--k-timer); border-style: dashed; }
.chip.model { color: var(--warn); }
.chip.fake { border-style: dashed; color: var(--warn); }
.chip.fol { color: var(--k-post); border-style: dotted; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; align-items: start; }
.graph-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: auto; min-width: 0; }
.graph { position: relative; padding: 24px 40px 32px; min-width: max-content; display: flex; gap: 72px; align-items: flex-start; justify-content: center; }
.chain { display: flex; flex-direction: column; align-items: center; min-width: 620px; }
.day-head { align-self: stretch; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 6px; border-top: 2px solid var(--k-day); padding: 8px 0 22px; }
.day-head:first-child { padding-top: 6px; }
.day-head.unsched { border-top-color: var(--warn); border-top-style: dashed; }
.day-title { display: flex; align-items: baseline; gap: 8px; }
.day-title b { font-size: 15px; }
.day-title span { font-family: var(--f-mono); font-size: 11px; color: var(--dim); }
.day-items { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); max-width: 620px; }
.day-items > span { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.day-text, .day-title, .day-quiet { background: var(--panel); padding-right: 6px; }
.day-quiet { font-size: 12px; color: var(--dim); font-style: italic; }
.code { font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--panel); background: var(--ink); border-radius: 4px; padding: 1px 5px; letter-spacing: 0.02em; }
.chip.upkeep { color: var(--k-deploy); border-style: dotted; }
.chip.meter { color: var(--k-meter); }
.chip.meter.down { border-style: dashed; }
.chip.ending { color: var(--k-day); font-weight: 500; }
.uses { display: flex; flex-wrap: wrap; gap: 4px; }
.uses code { font-size: 10.5px; background: var(--soft); border-radius: 4px; padding: 1px 5px; }
.bands { font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); }
.mrow { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 12px; border-top: 1px solid var(--line); padding: 9px 0; }
.mrow:first-of-type { border-top: 0; }
.mrow > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
@media (max-width: 560px) { .mrow { grid-template-columns: minmax(0, 1fr); } }
.side-lane { width: 300px; position: relative; z-index: 1; }
.node.anytime { width: 100%; border-style: dashed; border-width: 1.5px; }
.side-list { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
.side-item { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 6px; }
.side-item > span:first-child { display: flex; align-items: center; gap: 6px; }
.side-item code { font-size: 11px; }
.side-out { font-size: 12px; color: var(--dim); }
.node-outs { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--dim); }
.layer { display: flex; gap: 28px; justify-content: center; position: relative; z-index: 1; }
.node { width: 230px; text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font: inherit; cursor: pointer; box-shadow: 0 1px 0 var(--line); }
.node:hover { border-color: var(--dim); }
.node.sel { border-color: var(--sel); box-shadow: 0 0 0 2px var(--sel); }
.node.start { border-top: 3px solid var(--k-deploy); }
.node.end { border-bottom: 3px solid var(--k-day); }
.node-id { font-family: var(--f-mono); font-size: 12px; font-weight: 500; display: flex; justify-content: space-between; gap: 6px; }
.node-id span { color: var(--dim); font-weight: 400; }
.node-id .nm { display: flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 500; }
.node-obj { font-size: 13px; line-height: 1.35; }
.node-meta { display: flex; flex-wrap: wrap; gap: 4px; }
.node-meta .chip { font-size: 10px; }
.edges { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: visible; }
.edges path { fill: none; stroke: var(--dim); stroke-width: 1.4; }
.edges path.back { stroke-dasharray: 5 4; }
.edges marker path { fill: var(--dim); stroke: none; }
.elabel { position: absolute; z-index: 2; transform: translate(-50%, 0); display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; }
.detail { position: sticky; top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.detail h3 { margin: 0; font-family: var(--f-mono); font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.detail h3 .code { font-size: 13px; padding: 2px 7px; }
.detail .obj { margin: 0; font-weight: 600; }
.detail .scene { margin: 0; color: var(--dim); font-size: 13px; }
.br { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.br-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.br-head code { font-weight: 500; font-size: 12.5px; }
.br p { margin: 0; font-size: 12.5px; }
.lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin-right: 4px; }
.kw { font-family: var(--f-mono); font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
.quote { border-left: 2px solid var(--line); padding-left: 8px; color: var(--dim); white-space: pre-wrap; }
.fx { font-family: var(--f-mono); font-size: 11px; overflow-wrap: anywhere; }
.outcome { display: flex; flex-direction: column; gap: 6px; }
.ocard { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--soft); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ocard.mail { border-left: 3px solid var(--k-mail); }
.ocard.post { border-left: 3px solid var(--k-post); }
.ocard.agent { border-left: 3px solid var(--k-prompt); }
.ocard.end { border-left: 3px solid var(--k-day); }
.ohead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; }
.ohead code { color: var(--dim); }
.osubj { margin: 0; font-weight: 600; font-size: 12.5px; }
.otext { margin: 0; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.olater { border-left: 1px dashed var(--line); padding-left: 10px; display: flex; flex-direction: column; gap: 6px; }
.lines { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.tok { color: var(--k-mail); font-family: var(--f-mono); font-size: 0.85em; }
.go { color: var(--sel); cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; font: inherit; }
.ref { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-weight: 500; font-size: 11px; color: var(--dim); padding: 0 8px 6px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll { overflow-x: auto; }
.note { margin: 0; color: var(--dim); font-size: 12.5px; }
.warnbox { border: 1px solid var(--warn); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
button:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
@media (max-width: 1000px) { .work { grid-template-columns: minmax(0, 1fr); } .detail { position: static; max-height: none; } }
</style>

<body>
<!--build:body-->
<div class="page">
  <header class="top">
    <div>
      <h1 id="title">Story map</h1>
      <p id="subtitle">Author's overview, generated from <code>src/story.js</code>.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="legend" id="legend"></div>
  <div class="work">
    <div class="graph-wrap"><div class="graph" id="graph"></div></div>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>
  <div class="ref" id="ref"></div>
</div>
<script src="../src/story.js"></script>
<script>
(function () {
  'use strict';
  const S = window.STORY;
  const arr = (x) => (x == null ? [] : Array.isArray(x) ? x : [x]);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const bundle = (fx) => (typeof fx === 'string' ? (S.bundles || {})[fx] || {} : fx || {});
  const model = (n) => (S.models && S.models[n - 1] ? S.models[n - 1].name : `tier ${n}`);
  const KIND = { prompt: 'agent prompt', post: 'Y post', mail: 'email', deploy: 'deploy', day: 'new day', timer: 'delay' };

  function delayText(l) {
    if (l.nextDay != null) return `next day ${l.nextDay}:00`;
    if (Array.isArray(l.hours)) return `${l.hours[0]}–${l.hours[1]}h`;
    return `${l.hours || 0}h`;
  }

  // Every node an effect leads to, including through bundles and delayed effects.
  function gotos(fx, delay) {
    fx = bundle(fx);
    const out = [];
    if (fx.goto) out.push({ to: fx.goto, delay: delay || null });
    for (const l of arr(fx.later)) out.push(...gotos(l.effects, delayText(l)));
    for (const o of fx.choose || []) out.push(...gotos(o.effects, delay));
    return out;
  }
  // every effect object reachable from fx: through bundles, delays and choices
  function deepFx(fx, seen) {
    fx = bundle(fx);
    seen = seen || [];
    if (seen.includes(fx)) return [];
    seen.push(fx);
    return [fx, ...arr(fx.later).flatMap((l) => deepFx(l.effects, seen)), ...(fx.choose || []).flatMap((o) => deepFx(o.effects, seen))];
  }
  const setsFlag = (fx, f) => deepFx(fx).some((x) => x.set && x.set[f]);
  // meters by id, and readable conditions/deltas
  const meterDef = (id) => (S.meters || []).find((m) => m.id === id) || { id, label: id };
  const range = (c) => [c.min != null ? `≥ ${c.min}` : '', c.max != null ? `≤ ${c.max}` : ''].filter(Boolean).join(' and ');
  const meterCond = (m) => Object.entries(m).map(([id, c]) => `${meterDef(id).label} ${range(c)}`).join(', ');
  const meterFx = (m) => Object.entries(m).map(([id, n]) => `${meterDef(id).label} ${n > 0 ? '+' : ''}${n}`).join(', ');
  // node codes: D2-B and friends, so the author can point at a step
  const codeOf = (id) => (S.nodes[id] && S.nodes[id].code) || '';
  const nodeName = (id) => (codeOf(id) ? `${codeOf(id)} ${id}` : id);
  const byCode = {};
  for (const [id, n] of Object.entries(S.nodes)) if (n.code) (byCode[n.code.toLowerCase()] = byCode[n.code.toLowerCase()] || []).push(id);

  // ── build the graph ──
  const nodeIds = Object.keys(S.nodes);
  const edges = [];
  const add = (from, to, e) => { if (S.nodes[to]) edges.push({ from, to, ...e }); };

  for (const id of nodeIds) {
    for (const b of S.nodes[id].branches || []) {
      for (const g of gotos(b.effects)) add(id, g.to, { kind: 'prompt', id: b.id, minModel: b.minModel, minFollowers: b.minFollowers, delay: g.delay, fx: b.effects });
      // on a too-weak model the branch may still go somewhere, with a botched result
      if (b.fake) for (const g of gotos(b.fake.effects)) add(id, g.to, { kind: 'prompt', id: b.id, below: b.minModel, delay: g.delay, fx: b.fake.effects });
      for (const [tier, alt] of Object.entries(b.atModel || {})) for (const g of gotos(alt.effects)) add(id, g.to, { kind: 'prompt', id: b.id, minModel: Number(tier), delay: g.delay, fx: alt.effects });
    }
  }
  for (const [kind, list] of [['post', S.postActions || []], ['mail', S.mailActions || []]]) {
    for (const a of list) for (const n of arr(a.when && a.when.node)) for (const g of gotos(a.effects)) add(n, g.to, { kind, id: a.id, minFollowers: a.minFollowers, delay: g.delay, fx: a.effects });
  }
  // nodes reached by branches that set a flag (used to place day events without a node condition)
  const flagNodes = {};
  for (const id of nodeIds) for (const b of S.nodes[id].branches || []) {
    const fx = bundle(b.effects);
    for (const f of Object.keys(fx.set || {})) for (const g of gotos(fx)) (flagNodes[f] = flagNodes[f] || new Set()).add(g.to);
  }
  for (const ev of S.events || []) {
    const from = ev.when && ev.when.node ? arr(ev.when.node)
      : ev.when && ev.when.flag ? [...arr(ev.when.flag).flatMap((f) => [...(flagNodes[f] || [])])] : [];
    const label = ev.on === 'deploy' ? `deploy ${ev.repo}` : `day${ev.when && ev.when.minDay ? ' ' + ev.when.minDay + '+' : ''}`;
    for (const n of from) for (const g of gotos(ev.effects)) add(n, g.to, { kind: ev.on === 'deploy' ? 'deploy' : 'day', id: label, delay: g.delay, fx: ev.effects });
  }

  // layers: longest path from the start node, ignoring edges back into already-visited layers
  const depth = { [S.start.node]: 0 };
  const queue = [S.start.node];
  const seenEdge = new Set();
  while (queue.length) {
    const n = queue.shift();
    for (const e of edges.filter((x) => x.from === n)) {
      const key = e.from + '>' + e.to;
      if (seenEdge.has(key)) continue;
      seenEdge.add(key);
      if (depth[e.to] == null || depth[e.to] < depth[n] + 1) {
        if (depth[e.to] != null && depth[e.to] <= depth[n]) continue; // a loop back
        depth[e.to] = depth[n] + 1;
        queue.push(e.to);
      }
    }
  }
  const unreachable = nodeIds.filter((n) => depth[n] == null);
  const maxDepth = Math.max(0, ...Object.values(depth));
  unreachable.forEach((n) => { depth[n] = maxDepth + 1; });
  const layers = [];
  for (const n of nodeIds) (layers[depth[n]] = layers[depth[n]] || []).push(n);

  // Day sections: each day holds its nodes, in story order, plus what the calendar brings that day.
  const E = S.economy;
  const WEEK = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const without = (w, k) => Object.fromEntries(Object.entries(w || {}).filter(([x]) => x !== k));
  function dayItems(d) {
    const items = [];
    for (const p of S.posts || []) if (p.when && p.when.minDay === d) items.push({ chip: 'post', label: `Y post ${p.id}`, cond: without(p.when, 'minDay'), text: clip(p.text, 90) });
    for (const m of S.mail || []) if (m.when && m.when.minDay === d) items.push({ chip: 'mail', label: `email ${m.id}`, cond: without(m.when, 'minDay'), text: `“${m.subject}” from ${m.from}` });
    for (const ev of S.events || []) if (ev.on === 'day' && ev.when && ev.when.minDay === d) items.push({ chip: 'day', label: `event ${ev.id || ''}`, cond: without(ev.when, 'minDay'), text: summary(ev.effects) });
    if (E.rent && E.rent.day === d) items.push({ chip: 'model', label: 'end of day', text: `rent $${E.rent.amount} (auto-pay to ${E.rent.payee}). Below $0 = evicted.` });
    return items;
  }
  const nodeDays = nodeIds.map((n) => S.nodes[n].day).filter((d) => d != null);
  const calendarDays = [...(S.posts || []), ...(S.mail || []), ...(S.events || [])].map((x) => x.when && x.when.minDay).filter(Boolean).concat(E.rent ? [E.rent.day] : []);
  const firstDay = Math.min(S.start.day, ...nodeDays), lastDay = Math.max(...nodeDays, ...calendarDays);
  const sections = [];
  for (let d = firstDay; d <= lastDay; d++) {
    sections.push({ day: d, rows: layers.map((ids) => (ids || []).filter((id) => S.nodes[id].day === d)).filter((r) => r.length) });
  }
  const unscheduled = layers.map((ids) => (ids || []).filter((id) => S.nodes[id].day == null)).filter((r) => r.length);
  if (unscheduled.length) sections.push({ day: null, rows: unscheduled });
  const rows = sections.flatMap((sec) => sec.rows);
  const rowOf = {};
  rows.forEach((r, i) => r.forEach((id) => { rowOf[id] = i; }));

  // where upkeep starts: the node whose way in sets the flag the repo's upkeep waits for
  const upkeepAt = {};
  for (const [repo, def] of Object.entries(S.repos || {})) {
    const f = def.upkeep && def.upkeep.when && arr(def.upkeep.when.flag)[0];
    if (!f) continue;
    for (const e of edges) if (e.fx && setsFlag(e.fx, f)) (upkeepAt[e.to] = upkeepAt[e.to] || new Set()).add(repo);
  }

  const endNodes = new Set();
  for (const ev of S.events || []) for (const g of gotos(ev.effects)) if (bundle(ev.effects).end) endNodes.add(g.to);
  for (const n of nodeIds) if (!(S.nodes[n].branches || []).length) endNodes.add(n);

  // ── render ──
  document.getElementById('title').textContent = `${S.title}: story map`;
  document.getElementById('subtitle').innerHTML = `${esc(S.chapter)} · generated from <code>src/story.js</code>. Not for players.`;
  const allBranches = nodeIds.flatMap((n) => S.nodes[n].branches || []);
  const advancing = new Set(edges.map((e) => `${e.from}:${e.kind}:${e.id}`));
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  document.getElementById('stats').innerHTML =
    stat(nodeIds.length, 'nodes') + stat(allBranches.length, 'node branches') + stat(advancing.size, 'ways forward') +
    stat((S.global || []).length, 'global branches') + stat((S.postActions || []).length + (S.mailActions || []).length, 'post & mail actions');
  document.getElementById('legend').innerHTML = Object.entries(KIND).map(([k, l]) => `<span class="chip ${k}">${esc(l)}</span>`).join('') +
    `<span class="chip model">agent-N+ needed</span><span class="chip fake">too weak: botched</span><span class="chip fol">N+ Y followers</span><span class="chip meter">meter change</span>`;

  const graph = document.getElementById('graph');
  const sideMail = (S.mailActions || []).filter((a) => !(a.when && a.when.node));
  const sidePosts = (S.postActions || []).filter((a) => !(a.when && a.when.node));
  function renderGraph() {
  // (items are worked out at render time: they use helpers defined further down)
  const dayHead = (sec) => (sec.items = sec.day == null ? [] : dayItems(sec.day), sec.day == null
    ? `<div class="day-head unsched"><div class="day-title"><b>Unscheduled</b><span>nodes without a day</span></div></div>`
    : `<div class="day-head" id="day-${sec.day}"><div class="day-title"><b>Day ${sec.day}</b><span>${WEEK[(sec.day - 1) % 7]}</span></div>${sec.items.length
      ? `<div class="day-items">${sec.items.map((it) => `<span><span class="chip ${it.chip}">${esc(it.label)}</span>${Object.keys(it.cond || {}).length ? `<span class="chip timer">if ${esc(whenText(it.cond))}</span>` : ''}<span class="day-text">${esc(it.text)}</span></span>`).join('')}</div>`
      : sec.rows.length ? '' : '<span class="day-quiet">Nothing scheduled. Apps earn, upkeep rolls, the player keeps going.</span>'}</div>`);
  graph.innerHTML = `<div class="chain">` + sections.map((sec) => dayHead(sec) + sec.rows.map((ids) => `<div class="layer">${ids.map((id) => {
    const n = S.nodes[id];
    const out = edges.filter((e) => e.from === id);
    const stays = (n.branches || []).filter((b) => !out.some((e) => e.kind === 'prompt' && e.id === b.id)).length;
    const models = [...new Set((n.branches || []).filter((b) => b.minModel > 1).map((b) => b.minModel))];
    const fols = [...new Set([...(n.branches || []), ...(S.postActions || []).filter((a) => arr(a.when && a.when.node).includes(id))].filter((b) => b.minFollowers).map((b) => b.minFollowers))];
    return `<button class="node${id === S.start.node ? ' start' : ''}${endNodes.has(id) ? ' end' : ''}" data-node="${esc(id)}" id="n-${esc(id)}">
      <span class="node-id"><span class="nm">${codeOf(id) ? `<span class="code">${esc(codeOf(id))}</span>` : ''}${esc(id)}</span><span>${id === S.start.node ? 'start' : endNodes.has(id) ? 'end' : unreachable.includes(id) ? 'unreachable' : ''}</span></span>
      <span class="node-obj">${esc(n.objective || '')}</span>
      <span class="node-meta"><span class="chip prompt">${(n.branches || []).length} branches</span>${stays ? `<span class="chip timer">${stays} stay</span>` : ''}${models.map((m) => `<span class="chip model">${esc(model(m))}+</span>`).join('')}${fols.map((f) => `<span class="chip fol">${f}+ followers</span>`).join('')}${[...(upkeepAt[id] || [])].map((r) => `<span class="chip upkeep">upkeep: ${esc(r)}</span>`).join('')}</span>
      ${(() => {
        // branches that change something without moving the story on
        const quiet = (n.branches || []).filter((b) => hasOutcome(b) && !out.some((e) => e.kind === 'prompt' && e.id === b.id));
        return quiet.length ? `<span class="node-outs">${quiet.map((b) => `<span><code>${esc(b.id)}</code>: ${esc(summary(b.effects || {}))}</span>`).join('')}</span>` : '';
      })()}
    </button>`;
  }).join('')}</div>`).join('')).join('') + `</div>
    <div class="side-lane"><button class="node anytime" data-node="anytime" id="n-anytime">
      <span class="node-id">anytime<span>every step</span></span>
      <span class="node-obj">Side content that works at any point in the story.</span>
      <span class="side-list">
        ${sideMail.map((a) => `<span class="side-item"><span><span class="chip mail">email</span><code>${esc(a.id)}</code>${a.when && a.when.notFlag ? '<span class="chip timer">once</span>' : ''}</span><span class="side-out">${esc(summary(a.effects))}</span></span>`).join('')}
        ${sidePosts.map((a) => `<span class="side-item"><span><span class="chip post">Y post</span><code>${esc(a.id)}</code></span><span class="side-out">${esc(summary(a.effects))}</span></span>`).join('')}
        ${(S.global || []).filter(hasOutcome).map((b) => `<span class="side-item"><span><span class="chip prompt">agent prompt</span><code>${esc(b.id)}</code></span><span class="side-out">${[b.effects ? summary(b.effects) : '', ...Object.entries(b.atModel || {}).map(([t, alt]) => `on ${model(Number(t))}+: ${summary(alt.effects || {}) || 'different reply'}`)].filter(Boolean).map(esc).join(' · ')}</span></span>`).join('')}
        ${(S.events || []).filter((ev) => ev.on === 'day' && !(ev.when && ev.when.minDay)).map((ev) => `<span class="side-item"><span><span class="chip day">morning check</span><code>${esc(ev.id || '')}</code></span><span class="side-out">if ${esc(whenText(ev.when || {}))}: ${esc(summary(ev.effects))}</span></span>`).join('')}
        <span class="side-item"><span class="side-out">${(S.global || []).filter((b) => !hasOutcome(b)).length} more agent prompts that only talk back · ${Object.keys(S.contacts || {}).length} contacts answer any other email</span></span>
      </span>
    </button></div>
    <svg class="edges" id="edges" aria-hidden="true"></svg>`;
  }

  // group edges per node pair and draw them once the cards have their real sizes
  const pairs = {};
  for (const e of edges) (pairs[e.from + '>' + e.to] = pairs[e.from + '>' + e.to] || []).push(e);
  function chipFor(e) {
    const extra = [e.minModel > 1 ? `${model(e.minModel)}+` : '', e.minFollowers ? `${e.minFollowers}+ followers` : '', e.below ? `below ${model(e.below)}: botched` : '', e.delay ? `after ${e.delay}` : ''].filter(Boolean).join(' · ');
    return `<span class="chip ${e.kind}${e.below ? ' fake' : ''}">${esc(e.kind === 'deploy' || e.kind === 'day' ? e.id : `${KIND[e.kind]}: ${e.id}`)}${extra ? ' · ' + esc(extra) : ''}</span>`;
  }
  // leave room between layers for every trigger label on the edges leaving them
  function spaceLayers() {
    const layerEls = graph.querySelectorAll('.layer');
    layerEls.forEach((el, i) => {
      const most = Math.max(0, ...Object.values(pairs).filter((l) => rowOf[l[0].from] === i && rowOf[l[0].to] > i).map((l) => l.length));
      el.style.marginBottom = i === layerEls.length - 1 ? '0' : `${Math.max(48, most * 24 + 34)}px`;
    });
  }

  function drawEdges() {
    graph.querySelectorAll('.elabel').forEach((x) => x.remove());
    const svg = document.getElementById('edges');
    const box = graph.getBoundingClientRect();
    svg.setAttribute('width', graph.scrollWidth);
    svg.setAttribute('height', graph.scrollHeight);
    let paths = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>';
    let labels = '';
    for (const list of Object.values(pairs)) {
      const a = document.getElementById('n-' + list[0].from).getBoundingClientRect();
      const b = document.getElementById('n-' + list[0].to).getBoundingClientRect();
      const ax = a.left - box.left + a.width / 2, ay = a.bottom - box.top;
      const bx = b.left - box.left + b.width / 2, by = b.top - box.top;
      let d, mx, my, back = false;
      if (by > ay + 4) {
        const c = (by - ay) / 2;
        d = `M${ax},${ay} C${ax},${ay + c} ${bx},${by - c} ${bx},${by}`;
        // labels sit just under the source card, in the gap before the next row or day header
        mx = ax; my = ay + 12;
      } else {
        back = true;
        const rx = Math.max(a.right, b.right) - box.left + 40;
        const sy = a.top - box.top + a.height / 2, ty = b.top - box.top + b.height / 2;
        d = `M${a.right - box.left},${sy} C${rx},${sy} ${rx},${ty} ${b.right - box.left},${ty}`;
        mx = rx - 10; my = (sy + ty) / 2;
      }
      paths += `<path d="${d}" class="${back ? 'back' : ''}" marker-end="url(#arrow)"/>`;
      labels += `<div class="elabel" style="left:${mx}px;top:${my}px">${list.map(chipFor).join('')}</div>`;
    }
    svg.innerHTML = paths;
    graph.insertAdjacentHTML('beforeend', labels);
  }

  // ── detail panel ──
  function kw(match) {
    if (!match) return '';
    const g = (match.all || []).map((grp) => arr(grp).slice(0, 4).join('|') + (arr(grp).length > 4 ? '…' : ''));
    return g.join('  ×  ') + (match.none ? `  (not: ${arr(match.none).join(', ')})` : '');
  }
  // Full text, with {placeholders} marked so it's clear what the game fills in.
  const txt = (s) => esc(s || '').replace(/\{(\w+)\}/g, '<span class="tok">{$1}</span>');
  const postById = (id) => (S.posts || []).find((p) => p.id === id);
  const mailById = (id) => (S.mail || []).find((m) => m.id === id);

  function postCard(p) {
    if (!p) return '';
    return `<div class="ocard post"><div class="ohead"><span class="chip post">Y post</span><b>${txt(p.author)}</b>${p.verified ? ' ✓' : ''}<code>@${txt(p.handle)}</code><code>${p.likes || 0} likes</code></div><p class="otext">${txt(p.text)}</p></div>`;
  }
  function mailCard(m) {
    if (!m) return '';
    const sent = m.folder === 'sent';
    return `<div class="ocard mail"><div class="ohead"><span class="chip mail">${sent ? 'sent email' : 'email'}</span><b>${sent ? 'You' : txt(m.from)}</b><code>${sent ? 'to ' + esc(m.to) : esc(m.addr || '')}</code></div>
      <p class="osubj">${txt(m.subject)}</p><p class="otext">${txt(m.body)}</p></div>`;
  }
  // Everything an effect produces, readable: facts, then the emails, posts and messages it delivers.
  function outcomeHtml(fx, depth) {
    depth = depth || 0;
    const name = typeof fx === 'string' ? fx : null;
    fx = bundle(fx);
    const facts = [];
    if (fx.goto) facts.push(`→ ${fx.goto}`);
    if (fx.set) facts.push('set ' + Object.entries(fx.set).map(([k, v]) => (v === true ? k : `${k}=${v}`)).join(', '));
    if (fx.money != null) { const m = typeof fx.money === 'number' ? { amount: fx.money, memo: '' } : fx.money; facts.push(`${m.amount >= 0 ? '+' : ''}$${m.amount}${m.memo ? ` (“${m.memo}”)` : ''}`); }
    if (fx.repo) facts.push(`repo ${arr(fx.repo).map((r) => (typeof r === 'string' ? r : `${r.name}${r.broken ? ' (BROKEN)' : ''}`)).join(', ')}`);
    if (fx.fix) facts.push(`fixes ${arr(fx.fix).join(', ')}`);
    if (fx.followers) facts.push(`${fx.followers > 0 ? '+' : ''}${fx.followers} Y followers`);
    if (fx.fixDefect) facts.push(`fixes defect ${fx.fixDefect.id} in ${fx.fixDefect.repo}`);
    if (fx.app) facts.push(`app ${fx.app.repo}${fx.app.label ? ` (“${fx.app.label}”)` : ''}: ${fx.app.users} users, $${fx.app.perDay}/day`);
    if (fx.appScale) facts.push(`${fx.appScale.repo}: users and income ×${fx.appScale.factor}`);
    let html = '';
    if (fx.meters) html += `<p class="uses">${Object.entries(fx.meters).map(([id, n]) => `<span class="chip meter${n < 0 ? ' down' : ''}">${esc(meterDef(id).label)} ${n > 0 ? '+' : ''}${n}</span>`).join('')}</p>`;
    if (name) html += `<p class="fx"><span class="lbl">bundle</span>${esc(name)}</p>`;
    if (facts.length) html += `<p class="fx"><span class="lbl">effects</span>${esc(facts.join(' · '))}</p>`;
    html += arr(fx.mail).map((id) => mailCard(mailById(id)) || `<p class="warnbox">Missing mail “${esc(id)}”</p>`).join('');
    html += arr(fx.post).map((id) => postCard(postById(id)) || `<p class="warnbox">Missing post “${esc(id)}”</p>`).join('');
    if (fx.agent) html += `<div class="ocard agent"><div class="ohead"><span class="chip prompt">agent writes first</span></div><p class="otext">${txt(fx.agent)}</p></div>`;
    for (const repo of arr(fx.complain)) {
      const c = (S.repos[repo] || {}).client || {};
      html += `<div class="ocard ${c.type === 'y' ? 'post' : 'mail'}"><div class="ohead"><span class="chip ${c.type === 'y' ? 'post' : 'mail'}">complaint</span><b>${esc(repo)}</b></div><p class="otext">${c.type === 'y' ? 'Users post on Y about every open defect they have not complained about yet.' : `${esc(c.addr || 'The client')} emails about one open defect (its complaint text) and waits to be told again.`}</p></div>`;
    }
    if (fx.choose) for (const [i, o] of fx.choose.entries()) {
      html += `<div class="olater"><span><span class="chip timer">${o.when ? 'if ' + esc(whenText(o.when)) : i ? 'otherwise' : 'always'}</span></span>${depth < 4 ? outcomeHtml(o.effects, depth + 1) : ''}</div>`;
    }
    if (fx.ending) html += `<div class="ocard end"><div class="ohead"><span class="chip ending">ending picked by the meters</span></div><p class="otext">The first of the ${(S.endings || []).length} endings whose condition holds plays. See Endings below.</p></div>`;
    if (fx.end) html += `<div class="ocard end"><div class="ohead"><span class="chip day">chapter end screen</span><b>${txt(fx.end.title)}</b></div><p class="otext">${txt(fx.end.text)}</p></div>`;
    for (const l of arr(fx.later)) html += `<div class="olater"><span><span class="chip timer">after ${esc(delayText(l))}</span></span>${depth < 4 ? outcomeHtml(l.effects, depth + 1) : ''}</div>`;
    return html ? `<div class="outcome">${html}</div>` : '';
  }

  function summary(fx) {
    fx = bundle(fx);
    const parts = [];
    if (fx.goto) parts.push(`→ ${fx.goto}`);
    if (fx.money != null) { const a = typeof fx.money === 'number' ? fx.money : fx.money.amount; parts.push(`${a >= 0 ? '+' : '−'}$${Math.abs(a)}`); }
    for (const id of arr(fx.mail)) { const m = mailById(id); parts.push(m && m.folder === 'sent' ? `sends “${m.subject}”` : `email “${m ? m.subject : id}”`); }
    for (const id of arr(fx.post)) parts.push(`Y post ${id}`);
    if (fx.repo) parts.push(`repo ${arr(fx.repo).map((r) => (typeof r === 'string' ? r : `${r.name}${r.broken ? ' (broken)' : ''}`)).join(', ')}`);
    if (fx.fix) parts.push(`fixes ${arr(fx.fix).join(', ')}`);
    if (fx.followers) parts.push(`${fx.followers > 0 ? '+' : ''}${fx.followers} followers`);
    if (fx.app) parts.push(`${fx.app.label || fx.app.repo} $${fx.app.perDay}/day`);
    if (fx.appScale) parts.push(`${fx.appScale.repo} ×${fx.appScale.factor}`);
    if (fx.meters) parts.push(meterFx(fx.meters));
    if (fx.ending) parts.push('ending (by meters)');
    if (fx.complain) parts.push(`complaint about ${arr(fx.complain).join(', ')}`);
    if (fx.choose) parts.push(fx.choose.map((o, i) => `${o.when ? 'if ' + whenText(o.when) : 'otherwise'}: ${summary(o.effects)}`).join(' / '));
    if (fx.agent) parts.push('agent message');
    if (fx.end) parts.push('ending');
    for (const l of arr(fx.later)) parts.push(`after ${delayText(l)}: ${summary(l.effects)}`);
    // flags are bookkeeping; mention them only when nothing else happens
    if (fx.set && !parts.length) parts.push('flag ' + Object.keys(fx.set).join(', '));
    return parts.join(' · ');
  }
  const hasOutcome = (b) => !!(b.effects || b.atModel);

  function branchHtml(b, kind, nodeId) {
    const out = gotos(b.effects);
    const go = out.length ? out.map((g) => `<button class="go" data-node="${esc(g.to)}">→ ${esc(nodeName(g.to))}</button>${g.delay ? ` <span class="chip timer">after ${esc(g.delay)}</span>` : ''}`).join(' ') : '<span class="chip timer">stays</span>';
    const when = b.when ? whenText(b.when) : '';
    return `<div class="br">
      <div class="br-head"><span class="chip ${kind}">${esc(KIND[kind])}</span><code>${esc(b.id)}</code>${b.minModel > 1 ? `<span class="chip model">${esc(model(b.minModel))}+</span>` : ''}${b.minFollowers ? `<span class="chip fol">${b.minFollowers}+ followers</span>` : ''}${go}</div>
      ${b.intent ? `<p><span class="lbl">Jev</span>${esc(b.intent)}</p>` : '<p class="warnbox">No intent: Jev can never choose this.</p>'}
      ${when ? `<p class="kw"><span class="lbl">when</span>${esc(when)}</p>` : ''}
      ${b.match ? `<p class="kw"><span class="lbl">offline</span>${esc(kw(b.match))}</p>` : ''}
      ${b.response ? `<p class="quote">${txt(b.response)}</p>` : ''}
      ${b.partial ? `<p><span class="lbl">nudge</span>${txt(b.partial)}</p>` : ''}
      ${b.minModel > 1 && !b.fake ? `<p><span class="lbl">too weak</span>${txt(b.weak || S.agent.lockedResponse)}${b.weak ? '' : ' <span class="chip timer">default</span>'}</p>` : ''}
      ${b.minFollowers && kind === 'prompt' ? `<p><span class="lbl">too few followers</span>${txt(b.fewFollowers || (S.y || {}).lockedResponse)}${b.fewFollowers ? '' : ' <span class="chip timer">default</span>'}</p>` : ''}
      ${b.minFollowers && kind === 'post' ? '<p class="note">With too few followers the post lands nowhere: the player sees a toast and the story stays put.</p>' : ''}
      ${b.fake ? `<div class="olater"><span><span class="chip fake">below ${esc(model(b.minModel))}: pretends it worked</span></span><p class="quote">${txt(b.fake.response)}</p>${b.fake.effects ? outcomeHtml(b.fake.effects) : '<p class="note">Nothing actually happens.</p>'}</div>` : ''}
      ${b.effects ? outcomeHtml(b.effects) : ''}
      ${kind === 'mail' && !(b.effects && JSON.stringify(bundle(b.effects)).includes('"mail"')) ? '<p class="note">No scripted reply: the contact answers with an ordinary reply instead.</p>' : ''}
      ${Object.entries(b.atModel || {}).map(([t, alt]) => `<div class="olater"><span><span class="chip model">on ${esc(model(Number(t)))}+ instead</span></span>${alt.response ? `<p class="quote">${txt(alt.response)}</p>` : ''}${alt.effects ? outcomeHtml(alt.effects) : ''}</div>`).join('')}
    </div>`;
  }
  function select(id) {
    if (id === 'anytime') return selectAnytime();
    if (!S.nodes[id] && byCode[String(id).toLowerCase()]) id = byCode[String(id).toLowerCase()][0];
    if (!S.nodes[id]) id = S.start.node;
    graph.querySelectorAll('.node').forEach((el) => el.classList.toggle('sel', el.dataset.node === id));
    const n = S.nodes[id];
    const posts = (S.postActions || []).filter((a) => arr(a.when && a.when.node).includes(id));
    const mails = (S.mailActions || []).filter((a) => arr(a.when && a.when.node).includes(id));
    const evs = edges.filter((e) => e.from === id && (e.kind === 'deploy' || e.kind === 'day'));
    const incoming = edges.filter((e) => e.to === id);
    document.getElementById('detail').innerHTML = `
      <h3>${n.code ? `<span class="code">${esc(n.code)}</span>` : ''}${esc(id)}</h3>
      <p class="kw">${n.day != null ? `Day ${n.day} · ` : '<span class="warnbox">no day</span> '}point at it as <code>${esc(n.code || id)}</code> when editing</p>
      <p class="obj">${esc(n.objective || '')}</p>
      ${n.scene ? `<p class="scene"><span class="lbl">scene for Jev</span>${esc(n.scene)}</p>` : '<p class="warnbox">No scene: Jev gets only the objective.</p>'}
      <p class="note">Reached from: ${incoming.length ? incoming.map((e) => `<button class="go" data-node="${esc(e.from)}">${esc(nodeName(e.from))}</button> (${esc(e.kind === 'deploy' || e.kind === 'day' ? e.id : KIND[e.kind] + ' ' + e.id)})`).join(', ') : 'game start'}</p>
      ${upkeepAt[id] ? `<p class="note">From here on, ${[...upkeepAt[id]].map((r) => `<code>${esc(r)}</code>`).join(', ')} need upkeep every night (see Upkeep below).</p>` : ''}
      <h2>Branches (${(n.branches || []).length})</h2>
      ${(n.branches || []).map((b) => branchHtml(b, 'prompt', id)).join('') || '<p class="note">None. This node is an ending.</p>'}
      ${posts.length ? `<h2>Y posts here</h2>${posts.map((b) => branchHtml(b, 'post', id)).join('')}` : ''}
      ${mails.length ? `<h2>Emails here</h2>${mails.map((b) => branchHtml(b, 'mail', id)).join('')}` : ''}
      ${evs.length ? `<h2>Events</h2>${evs.map((e) => `<div class="br"><div class="br-head"><span class="chip ${e.kind}">${esc(e.id)}</span><button class="go" data-node="${esc(e.to)}">→ ${esc(nodeName(e.to))}</button></div>${outcomeHtml(e.fx)}</div>`).join('')}` : ''}
      <p class="note">Side emails and ${(S.global || []).length} global prompts also work here: <button class="go" data-node="anytime">anytime</button>.</p>`;
    try { history.replaceState(null, '', '#' + (n.code || id)); } catch (e) { /* not allowed in some frames */ }
  }

  function selectAnytime() {
    graph.querySelectorAll('.node').forEach((el) => el.classList.toggle('sel', el.dataset.node === 'anytime'));
    document.getElementById('detail').innerHTML = `
      <h3>anytime</h3>
      <p class="obj">Side content that works at every step.</p>
      <p class="scene">These are offered no matter where the player is. Story-step branches win ties, so a global branch only fires when nothing more specific fits.</p>
      <h2>Side emails (${sideMail.length})</h2>${sideMail.map((b) => branchHtml(b, 'mail')).join('') || '<p class="note">None.</p>'}
      ${sidePosts.length ? `<h2>Side Y posts</h2>${sidePosts.map((b) => branchHtml(b, 'post')).join('')}` : ''}
      <h2>Global agent prompts (${(S.global || []).length})</h2>${(S.global || []).map((b) => branchHtml(b, 'prompt')).join('')}
      <p class="note">Any other email to a contact gets an ordinary reply (see Contacts below).</p>`;
    try { history.replaceState(null, '', '#anytime'); } catch (e) { /* not allowed in some frames */ }
  }

  // ── reference tables ──
  const ref = [];
  // who moves and who reads each meter and flag, anywhere in the story
  const uses = { up: {}, down: {}, read: {}, set: {}, test: {} };
  const push = (k, id, who) => { (uses[k][id] = uses[k][id] || []).push(who); };
  function walk(x, owner) {
    if (!x || typeof x !== 'object') return;
    if (Array.isArray(x)) { x.forEach((v) => walk(v, owner)); return; }
    const me = x.id || owner;
    for (const [k, v] of Object.entries(x)) {
      if (k === 'meters' && v && typeof v === 'object') {
        for (const [id, n] of Object.entries(v)) {
          if (typeof n === 'number') push(n >= 0 ? 'up' : 'down', id, `${me} ${n > 0 ? '+' : ''}${n}`);
          else push('read', id, `${me} (${range(n)})`);
        }
        continue;
      }
      if (k === 'set' && v && typeof v === 'object') for (const f of Object.keys(v)) push('set', f, me);
      if (k === 'flag' || k === 'notFlag') for (const f of arr(v)) push('test', f, k === 'notFlag' ? `${me} (not)` : me);
      walk(v, me);
    }
  }
  for (const [id, n] of Object.entries(S.nodes)) walk(n, nodeName(id));
  for (const key of ['global', 'postActions', 'mailActions', 'events', 'endings', 'posts', 'mail']) walk(S[key], key);
  for (const [n, fx] of Object.entries(S.bundles || {})) walk(fx, `bundle ${n}`);
  for (const [addr, c] of Object.entries(S.contacts || {})) walk(c, `email to ${c.name || addr}`);
  for (const m of S.models || []) walk(m.effects, `buy ${m.name}`);
  for (const [repo, def] of Object.entries(S.repos || {})) walk(def, repo);
  walk(S.agent, 'agent');
  for (const [f, d] of Object.entries(S.flags || {})) if (d.when) walk(d.when, `derived ${f}`);
  if (S.flags && S.flags.ending) push('set', 'ending', 'any ending');
  const useList = (list) => (list && list.length ? `<span class="uses">${list.map((x) => `<code>${esc(x)}</code>`).join('')}</span>` : '<span class="note">–</span>');

  if (S.meters) {
    const rows = S.meters.map((m) => {
      const bands = m.group === 'relationship' ? S.relationshipBands : m.bands;
      return `<div class="mrow"><div><b>${esc(m.label)}</b><code>${esc(m.id)}</code><span class="bands">${m.source ? `reads ${esc(m.source)}` : `${m.min} … ${m.max}, starts ${m.start}`}</span>
        ${bands ? `<span class="bands">${bands.map((b) => `${b.min}+ ${esc(b.label)}`).join(' · ')}</span>` : ''}</div>
        <div><span class="note">${esc(m.about || '')}</span>
        ${m.source ? '' : `<p class="kw"><span class="lbl">raised by</span></p>${useList(uses.up[m.id])}<p class="kw"><span class="lbl">lowered by</span></p>${useList(uses.down[m.id])}`}
        <p class="kw"><span class="lbl">decides</span></p>${useList(uses.read[m.id])}</div></div>`;
    }).join('');
    ref.push(`<section class="card"><h2>Pressure meters</h2><p class="note">Hidden from the player. Effects move them with <code>meters: { id: delta }</code>; conditions read them with <code>meters: { id: { min, max } }</code>. Money and followers read the wallet and Y.</p>${rows}</section>`);
  }
  if (S.endings) {
    ref.push(`<section class="card"><h2>Endings (checked in order)</h2><p class="note">When an effect says <code>ending: true</code> (the Day 8 <code>chapter_hook</code>), the first ending whose condition holds plays, then its end screen. The flag <code>ending</code> keeps the id for Chapter 2.</p>
      ${S.endings.map((e, i) => `<div class="br"><div class="br-head"><span class="chip ending">${i + 1}. ${esc(e.title)}</span><code>${esc(e.id)}</code><span class="chip timer">${e.when ? 'if ' + esc(whenText(e.when)) : 'otherwise'}</span></div>
        <p class="quote">${txt(e.text)}</p>${outcomeHtml(e.effects)}${e.open ? `<p class="kw"><span class="lbl">button opens</span>${esc(e.open)}</p>` : ''}</div>`).join('')}</section>`);
  }
  if (S.flags) {
    const used = new Set([...Object.keys(uses.set), ...Object.keys(uses.test)]);
    const unregistered = [...used].filter((f) => !S.flags[f]);
    ref.push(`<section class="card"><h2>Flags</h2><p class="note">Registered in <code>story.flags</code>. Derived flags (with a condition) are worked out live, so “is Spin Cycle still up?” is just <code>flag: 'spinLive'</code>.</p>
      ${unregistered.length ? `<p class="warnbox">Used but not registered: ${unregistered.map((f) => `<code>${esc(f)}</code>`).join(', ')}</p>` : ''}
      ${Object.entries(S.flags).map(([f, d]) => `<div class="mrow"><div><code><b>${esc(f)}</b></code>${d.when ? '<span class="chip timer">derived</span>' : ''}</div><div><span class="note">${esc(d.about || '')}</span>
        ${d.when ? `<p class="kw"><span class="lbl">true while</span>${esc(whenText(d.when))}</p>` : `<p class="kw"><span class="lbl">set by</span></p>${useList(uses.set[f])}`}
        <p class="kw"><span class="lbl">read by</span></p>${useList(uses.test[f])}</div></div>`).join('')}</section>`);
  }
  const A = S.agent || {};
  ref.push(`<section class="card"><h2>agent's own voice</h2>
    <p><span class="lbl">greeting</span></p><p class="quote">${txt(A.greeting)}</p>
    <p><span class="lbl">default too-weak reply</span></p><p class="quote">${txt(A.lockedResponse)}</p>
    ${A.onFake ? `<p><span class="lbl">every time it fakes a job</span></p>${outcomeHtml(A.onFake)}` : ''}
    <p><span class="lbl">canned roasts (no prompt matched, no local model)</span></p><ol class="lines">${(S.placeholders || []).map((x) => `<li>${txt(x)}</li>`).join('')}</ol>
    <p style="margin-top:10px"><span class="lbl">Gemma persona</span></p><p class="quote">${txt(A.llmPersona)}</p>
    <p><span class="lbl">Gemma examples</span></p><ol class="lines">${(A.llmExamples || []).map(([u, a]) => `<li><b>${txt(u)}</b> → ${txt(a)}</li>`).join('')}</ol>
  </section>`);
  if (S.y) {
    const Y = S.y;
    const needers = [...allBranches, ...(S.global || []), ...(S.postActions || []), ...(S.mailActions || [])].filter((b) => b.minFollowers);
    const givers = [...allBranches, ...(S.postActions || []), ...(S.mailActions || [])].filter((b) => JSON.stringify(bundle(b.effects)).includes('"followers"')).map((b) => b.id)
      .concat(Object.entries(S.bundles || {}).filter(([, f]) => f.followers).map(([n, f]) => `${n} (bundle, ${f.followers > 0 ? '+' : ''}${f.followers})`));
    ref.push(`<section class="card"><h2>Y followers</h2>
      <p class="note">Start with ${Y.startFollowers} followers. Every post is rated 0–4 by Jev (offline: a keyword heuristic); followers move with the rating, posts touching a trend get ×1.5, reposts earn nothing, and gains halve for each post past ${Y.postsPerDay || 3} a day.</p>
      <p><span class="lbl">rating rubric</span></p><ol class="lines" start="0">${(Y.rubric || []).map((x) => `<li>${txt(x)}</li>`).join('')}</ol>
      <p style="margin-top:8px"><span class="lbl">trends</span><span class="kw">${esc((Y.trends || []).join(', '))}</span></p>
      ${Y.creator ? `<p><span class="lbl">creator payouts</span>unlock at ${Y.creator.minFollowers} followers, then $${Y.creator.perFollower} per follower per night once the player turns them on (paused below the threshold).</p>` : ''}
      <p><span class="lbl">default too-few reply</span>${txt(Y.lockedResponse)}</p>
      <p><span class="lbl">needs followers</span>${needers.map((b) => `<code>${esc(b.id)}</code> ${b.minFollowers}+`).join(', ') || 'nothing'}</p>
      <p><span class="lbl">gives followers</span>${givers.map((x) => `<code>${esc(x)}</code>`).join(', ') || 'nothing'}</p>
    </section>`);
  }
  for (const [repo, def] of Object.entries(S.repos || {})) {
    const qa = def.qa;
    if (!qa) continue;
    const c = def.client || {};
    ref.push(`<section class="card"><h2>QA: ${esc(repo)}</h2>
      <p class="note">Ships with ${(qa.count || []).map((n, i) => `${n} on ${esc(model(i + 1))}`).join(', ')} random defects from this pool. Each fix may quietly break something else: ${(qa.regress || []).map((p, i) => `${Math.round(p * 100)}% on ${esc(model(i + 1))}`).join(', ')}. Vague "fix it" requests fix nothing.</p>
      <p class="note">Client checks by ${c.type === 'email' ? `email (${esc(c.addr)}): one complaint per check, payment only when clean` : 'Y: one complaint post per open defect; the app earns $0 until clean'}.</p>
      ${qa.defects.map((d) => `<div class="br">
        <div class="br-head"><span class="chip ${d.kind === 'bug' ? 'model' : 'fol'}">${esc(d.kind)}</span><code>${esc(d.id)}</code><span class="kw">slot: ${esc(d.slot)}</span></div>
        <p><span class="lbl">Jev</span>${esc(d.intent)}</p>
        ${d.match ? `<p class="kw"><span class="lbl">offline</span>${esc(kw(d.match))}</p>` : ''}
        <p><span class="lbl">fixed reply</span>${txt(d.fixed)}</p>
        ${d.onFix ? outcomeHtml(d.onFix) : ''}
        ${typeof d.complaint === 'string' ? `<p><span class="lbl">complaint</span>${txt(d.complaint)}</p>` : postCard(d.complaint)}
      </div>`).join('')}
    </section>`);
  }
  const said = (repo, m) => (!m ? '' : typeof m === 'string' ? `<p class="quote">${txt(m)}</p>` : postCard(m));
  for (const [repo, def] of Object.entries(S.repos || {})) {
    const up = def.upkeep;
    if (!up) continue;
    const c = def.client || {};
    const starts = Object.entries(upkeepAt).filter(([, set]) => set.has(repo)).map(([n]) => n);
    ref.push(`<section class="card"><h2>Upkeep: ${esc(repo)}</h2>
      <p class="note">Runs every night while the app is live, working, and <code>${esc(whenText(up.when))}</code>${starts.length ? ` (from ${starts.map((n) => `<button class="go" data-node="${esc(n)}">${esc(nodeName(n))}</button>`).join(', ')})` : ''}. At most one issue open at a time. Chance of a new one by quiet nights: ${up.chance.map((p, i) => `${i}: ${Math.round(p * 100)}%`).join(', ')}${up.chance.length > 1 ? ' (last repeats)' : ''}. Each issue comes once.</p>
      <p class="note"><b>update</b>: the app keeps paying; the fix changes the page for good. <b>break</b>: the app pays $0 until fixed. Client talks by ${c.type === 'email' ? `email (${esc(c.addr)}, subject “${esc(c.upkeepSubject || c.subject)}”)` : 'Y posts'}.</p>
      <p><span class="lbl">after ${up.warnAfter} nights open</span></p>${said(repo, up.warn)}
      <p><span class="lbl">after ${up.churnAfter} nights open</span>${up.churn && up.churn.drop ? 'the client leaves for good, upkeep stops' : 'runs once per ignored issue; the issue stays open'}</p>
      ${up.churn ? outcomeHtml(up.churn.effects) + said(repo, up.churn.message) : ''}
      ${up.issues.map((d) => `<div class="br">
        <div class="br-head"><span class="chip ${d.kind === 'break' ? 'model' : 'fol'}">${esc(d.kind)}</span><code>${esc(d.id)}</code><span class="kw">${d.page ? 'replaces the whole page' : `slot: ${esc(d.slot)}`}</span>${d.minModel > 1 ? `<span class="chip model">${esc(model(d.minModel))}+</span>` : ''}</div>
        <p><span class="lbl">client</span></p>${said(repo, d.complaint)}
        <p><span class="lbl">Jev</span>${esc(d.intent)}</p>
        ${d.match ? `<p class="kw"><span class="lbl">offline</span>${esc(kw(d.match))}</p>` : ''}
        <p><span class="lbl">fixed reply</span>${txt(d.fixed)}</p>
        ${d.onFix ? outcomeHtml(d.onFix) : ''}
        ${d.fake ? `<div class="olater"><span><span class="chip fake">below ${esc(model(d.minModel))}: pretends it worked</span></span><p class="quote">${txt(d.fake.response)}</p><p class="note">Nothing actually happens.</p></div>` : ''}
        ${d.thanks ? `<p><span class="lbl">1–3h after the fix</span></p>${said(repo, d.thanks)}` : ''}
      </div>`).join('')}
    </section>`);
  }
  const evLabel = (ev) => (ev.on === 'deploy' ? `deploy ${ev.repo}` : ev.on === 'takedown' ? `take down ${ev.repo}` : `every morning${ev.id ? ' · ' + ev.id : ''}`);
  ref.push(`<section class="card"><h2>Events</h2>${(S.events || []).map((ev) => `<div class="br"><div class="br-head"><span class="chip ${ev.on === 'day' ? 'day' : 'deploy'}">${esc(evLabel(ev))}</span></div>
    ${ev.when ? `<p class="kw"><span class="lbl">when</span>${esc(whenText(ev.when))}</p>` : ''}${outcomeHtml(ev.effects)}</div>`).join('')}</section>`);
  ref.push(`<section class="card"><h2>Contacts who reply</h2>${Object.entries(S.contacts || {}).map(([addr, c]) => `<div class="br">
    <div class="br-head"><span class="chip mail">${esc(c.reply ? delayText(c.reply) : 'never')}${c.reply && c.reply.chance != null ? ` · ${Math.round(c.reply.chance * 100)}%` : ''}</span><b>${txt(c.name)}</b><code>${esc(addr)}</code></div>
    <p><span class="lbl">Gemma persona</span>${txt(c.persona)}</p>
    ${c.onMail ? `<p><span class="lbl">every email to them</span></p>${outcomeHtml(c.onMail)}` : ''}
    <p><span class="lbl">sign-off</span>${txt(c.sign)}</p>
    <p><span class="lbl">fallback replies</span></p><ol class="lines">${(c.fallback || []).map((x) => `<li>${txt(x)}</li>`).join('')}</ol></div>`).join('')}
    <p class="note">Anyone else never replies, so the player gets one message to them.</p></section>`);
  function whenText(w) { return Object.entries(w).map(([k, v]) => (k === 'meters' ? meterCond(v) : `${k}: ${arr(v).join(', ')}`)).join(' · '); }
  const card = (kind, x) => (kind === 'post' ? postCard(x) : mailCard(x));
  const items = [...(S.posts || []).map((p) => ['post', p]), ...(S.mail || []).map((m) => ['mail', m])];
  ref.push(`<section class="card"><h2>Appears on a condition</h2>${items.filter(([, x]) => x.when).map(([k, x]) => `<div class="br"><p class="kw"><span class="lbl">when</span>${esc(whenText(x.when))} · <code>${esc(x.id)}</code></p>${card(k, x)}</div>`).join('') || '<p class="note">None.</p>'}</section>`);
  ref.push(`<section class="card"><h2>Delivered by effects</h2>${items.filter(([, x]) => x.at == null && !x.when).map(([k, x]) => {
    const users = [...allBranches, ...(S.global || []), ...(S.postActions || []), ...(S.mailActions || [])].filter((b) => JSON.stringify([b.effects, b.atModel]).includes(`"${x.id}"`)).map((b) => b.id);
    const viaBundles = Object.entries(S.bundles || {}).filter(([, f]) => JSON.stringify(f).includes(`"${x.id}"`)).map(([n]) => n + ' (bundle)');
    const by = users.concat(viaBundles);
    return `<div class="br"><p class="kw"><code>${esc(x.id)}</code>${by.length ? ` · from ${esc(by.join(', '))}` : ''}</p>${card(k, x)}</div>`;
  }).join('')}</section>`);
  ref.push(`<section class="card"><h2>Seeded at game start</h2>${items.filter(([, x]) => x.at != null).sort((a, b) => b[1].at - a[1].at).map(([k, x]) => `<div class="br"><p class="kw"><code>${esc(x.id)}</code> · ${x.at} min before start</p>${card(k, x)}</div>`).join('')}</section>`);
  ref.push(`<section class="card"><h2>Models</h2><div class="scroll"><table class="tbl"><thead><tr><th>Model</th><th>Unlock</th><th>Prompt</th><th>Word</th><th>Needed by</th><th>On purchase</th></tr></thead><tbody>${
    (S.models || []).map((m, i) => {
      const need = allBranches.filter((b) => b.minModel === i + 1).map((b) => b.id).concat((S.global || []).filter((b) => b.atModel && b.atModel[i + 1]).map((b) => b.id + ' (bonus)'));
      return `<tr><td><code>${esc(m.name)}</code></td><td class="num">$${m.price}</td><td class="num">$${m.promptBase.toFixed(2)}</td><td class="num">$${m.perWord.toFixed(2)}</td><td>${need.map((x) => `<code>${esc(x)}</code>`).join(', ') || '–'}</td><td>${m.effects ? esc(summary(m.effects)) : '–'}</td></tr>`;
    }).join('')
  }</tbody></table></div><h2 style="margin-top:14px">Economy</h2><p class="note">Start ${'$' + S.start.money} on Day ${S.start.day} at ${S.start.hour}:00 · food $${E.living.amount}/night · hosting $${E.hostingPerDay}/app/night · rent $${E.rent.amount} at the end of Day ${E.rent.day} · each prompt takes ${E.promptHours}h · Jev hit ≥ ${S.decision.hit}, nudge ≥ ${S.decision.partial}</p></section>`);
  const missingCode = nodeIds.filter((n) => !S.nodes[n].code);
  const dupCodes = Object.entries(byCode).filter(([, ids]) => ids.length > 1);
  if (missingCode.length || dupCodes.length) ref.unshift(`<section class="card"><h2>Node codes</h2>${missingCode.length ? `<p class="warnbox">No code: ${missingCode.map((n) => `<code>${esc(n)}</code>`).join(', ')}</p>` : ''}${dupCodes.map(([c, ids]) => `<p class="warnbox">Code ${esc(c.toUpperCase())} used by ${ids.map((n) => `<code>${esc(n)}</code>`).join(', ')}</p>`).join('')}</section>`);
  if (unreachable.length) ref.unshift(`<section class="card"><h2>Problems</h2><p class="warnbox">Unreachable nodes: ${unreachable.map((n) => `<code>${esc(n)}</code>`).join(', ')}</p></section>`);
  document.getElementById('ref').innerHTML = ref.join('');

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-node]');
    if (!t) return;
    select(t.dataset.node);
    const card = document.getElementById('n-' + t.dataset.node);
    if (card && !t.classList.contains('node')) card.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  });
  renderGraph();
  select(decodeURIComponent((location.hash || '').slice(1)) || S.start.node);
  spaceLayers();
  drawEdges();
  window.addEventListener('resize', drawEdges);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawEdges);
})();
</script>
<!--/build:body-->
</body>
</html>
